<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AFTERSIGN — Kiosk Slice</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05070c;
        color: #edf7ff;
        --confirm-shake-x: 0px;
        --confirm-shake-y: 0px;
        --confirm-reticle-scale: 1;
        --confirm-reticle-y: 0px;
        --packet-progress: 0;
        --recognition-sign-glow: 0px;
        --recognition-seal-glow: 0px;
        --recognition-rain-rim-alpha: 0;
        --recognition-haptic-scale: 1;
        --recognition-warmth: 0;
        /* --io-recognition-* — snippet-authored per-tier motion values
           the dialogue selector picks and main.js writes onto this
           element (see aftersign/main.js :: applyIoRecognitionFeelCueVars).
           Zeroed off-beat; populated at the io-return-recognition beat
           from the SAME snippet that supplies lastLine + memoryRefs.
           The CSS rules below (body::after vignette, .panel dolly/yaw,
           .line reveal transition) consume them so the tier the
           selector chose actually shapes what the player sees — not a
           closed loop, a wired one. */
        --io-recognition-duration-ms: 0ms;
        --io-recognition-camera-dolly-cm: 0;
        --io-recognition-camera-yaw-deg: 0;
        --io-recognition-vignette-alpha: 0;
        --io-recognition-bloom-alpha: 0;
        /* Resolved warm-ring alpha (bloomAlpha * 3.6, clamped to 1) —
           PRE-MULTIPLIED IN JS (applyIoRecognitionFeelCueVars) so the
           .panel box-shadow color never needs calc() inside a color
           function. calc()-in-alpha is not grammar-safe across engines;
           when the engine rejects it the ENTIRE box-shadow declaration
           invalidates and the warm ring silently vanishes — the
           recurring bloom-regex CI failure on PR #1139. A plain number
           var substitutes cleanly into legacy rgba() everywhere. */
        --io-recognition-bloom-ring-alpha: 0;
        --io-recognition-line-reveal-delay-ms: 0ms;
        --io-recognition-line-reveal-duration-ms: 0ms;
        --io-recognition-easing: linear;

        /* --aftersign-return-* — return-tone choice feel envelope
           (see apps/web/src/aftersign/returnToneChoiceFeel.ts). Stamped
           onto the [data-aftersign-return-surface] node by main.js at
           the io-return-recognition beat via
           window.__game.applyReturnToneFeel(reason); the same reason
           token (kind / evasive / blunt) drives Io's voice memory
           thread. Defaults here are inert so the rule below still
           parses when the surface is un-hidden but no beat has fired
           yet — the rule reads through the cascade. */
        --aftersign-return-press-ms: 0ms;
        --aftersign-return-lift-px: 0px;
        --aftersign-return-settle-ms: 0ms;
        --aftersign-return-easing: linear;
        --aftersign-return-halo-scale: 1;
        --aftersign-return-halo-fade-ms: 0ms;
        --aftersign-return-shake-px: 0px;
        --aftersign-return-tone-hz: 0;
        --aftersign-return-tone-attack-ms: 0ms;
        --aftersign-return-tone-release-ms: 0ms;
        --aftersign-return-tone-gain: 0;

        /* --aftersign-tap-confirm-* — flagship per-commit press
           envelope (see apps/web/src/aftersign/tapConfirmFeel.ts).
           Stamped onto the tapped [data-aftersign-tap-choice] button
           by main.js ::  window.__game.applyTapConfirmFeel(choiceId)
           at the moment a fork COMMITS (packet pointerup, ack/skip
           route, deliver). Nine numbers, one row: pressScale ·
           releaseScale · pressMs · releaseMs · releaseEasing · glowPx
           · glowMs · shakePx · shakeMs. Defaults here are inert
           (identity transform, zero-duration transitions, no glow)
           so the base `button` rule's own transform+transition wins
           until `data-aftersign-tap-confirm="armed"` lands — then the
           tuned row overrides on the tapped button and only that
           button. Same discipline as the return-tone precedent above:
           the CSS layer parses cleanly with or without a beat firing,
           and a `pressMs: 72 → 73` edit in the JS row actually
           re-times the shipped surface. */
        --aftersign-tap-confirm-press-scale: 1;
        --aftersign-tap-confirm-release-scale: 1;
        --aftersign-tap-confirm-press-ms: 0ms;
        --aftersign-tap-confirm-release-ms: 0ms;
        --aftersign-tap-confirm-release-easing: linear;
        --aftersign-tap-confirm-glow-px: 0px;
        --aftersign-tap-confirm-glow-ms: 0ms;
        --aftersign-tap-confirm-shake-px: 0px;
        --aftersign-tap-confirm-shake-ms: 0ms;

        /* --aftersign-scene-transition-* — three-phase scene-
           transition envelope (see
           apps/web/src/aftersign/aftersignSceneTransitionFeel.ts).
           Mounted onto `[data-aftersign-scene-transition-surface]`
           by main.js's setBeat when a beat crosses a scene
           boundary (kiosk → io-return, io-return → orra-return)
           via `resolveAndPlayAftersignSceneTransition`, which
           stamps every ms/px/deg/alpha number on the
           `.aftersign-scene-transition` layer's `dataset.*`. This
           :root block declares INERT defaults so the CSS rule
           below still parses when no beat has fired yet — the
           rule reads through the cascade. The JS writer
           re-stamps the vars on every transition, so the numbers
           the player sees are always the tuned ones from the
           spec table (not these zero defaults). */
        --aftersign-scene-transition-total-ms: 0ms;
        --aftersign-scene-transition-camera-drift-px: 0px;
        --aftersign-scene-transition-camera-roll-deg: 0deg;
        --aftersign-scene-transition-vignette-alpha: 0;
        --aftersign-scene-transition-bloom-alpha: 0;
        --aftersign-scene-transition-easing: linear;
      }

      /* Scene-transition consumer rule. Reads the CSS variables
         the writer stamps on the mounted `.aftersign-scene-transition`
         layer so a returning player actually sees the drift + vignette
         + roll — not just a green dataset assertion in a vitest
         harness. The layer is `position: fixed; pointer-events: none`
         so it never intercepts a real tap on the tray beneath.
         Reduced-motion users get the vignette but no drift / roll
         — the writer already zeroes those channels when
         `reducedMotion=true`, and the `@media` block below is a
         belt-and-suspenders collapse so a future refactor that
         forgets to pass `reducedMotion` still doesn't shake the
         camera on someone who asked for calm. */
      .aftersign-scene-transition {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 60;
        background:
          radial-gradient(
            ellipse at 50% 62%,
            transparent 60%,
            rgba(0, 0, 0, var(--aftersign-scene-transition-vignette-alpha, 0)) 100%
          );
        transform:
          translateX(calc(var(--aftersign-scene-transition-camera-drift-px, 0px) * 0.15))
          rotate(var(--aftersign-scene-transition-camera-roll-deg, 0deg));
        transition:
          transform var(--aftersign-scene-transition-total-ms, 0ms)
            var(--aftersign-scene-transition-easing, linear),
          background var(--aftersign-scene-transition-total-ms, 0ms)
            var(--aftersign-scene-transition-easing, linear);
        box-shadow:
          inset 0 0 calc(var(--aftersign-scene-transition-bloom-alpha, 0) * 60px)
            rgba(200, 210, 255, var(--aftersign-scene-transition-bloom-alpha, 0));
      }
      @media (prefers-reduced-motion: reduce) {
        .aftersign-scene-transition {
          /* Collapse the motion channels; keep the vignette so
             the player still gets a beat of "the scene changed",
             just without the camera drift a vestibular-sensitive
             user asked us to skip. */
          transform: none;
          transition: background var(--aftersign-scene-transition-total-ms, 0ms)
            var(--aftersign-scene-transition-easing, linear);
        }
      }

      /* Return-tone press envelope — SHIPPED CONSUMER of the 11
         --aftersign-return-* variables (PR #1205 re-review: "zero CSS
         rules read any --aftersign-return-* variable" — fixed here).
         The surface is `hidden` today so no pixels move, but the
         moment the "why did you come back?" beat un-hides it (or a
         descendant opts into these vars), the tuned envelope is
         already what the browser paints — no CSS work required at
         wire-up time. Every one of the 11 CSS variables the writer
         stamps is consulted here so a `pressMs: 72 → 73` edit
         actually re-times the shipped surface. */
      [data-aftersign-return-surface] {
        transform: translateY(0) scale(var(--aftersign-return-halo-scale, 1));
        transition:
          transform var(--aftersign-return-press-ms, 0ms) var(--aftersign-return-easing, linear),
          opacity var(--aftersign-return-halo-fade-ms, 0ms) var(--aftersign-return-easing, linear);
        /* Filter reads press energy from the audio-cue channel so the
           gain / release numbers land in the paint pipeline too. */
        filter:
          blur(calc(var(--aftersign-return-shake-px, 0px) * 0.25))
          brightness(calc(1 + var(--aftersign-return-tone-gain, 0) * 4));
      }
      [data-aftersign-return-surface][data-aftersign-return-tone] {
        /* Lift + settle + tone envelope: the y-offset uses the tuned
           lift-px (up), and the shake-px drives a subtle x-jitter via
           box-shadow spread so blunt (2px) and evasive (1.5px) reads
           differently from kind (0px). Timings ride the settle-ms
           tail so a change to that number visibly re-times the
           release. Reads all remaining vars: settle-ms, attack-ms,
           release-ms, tone-hz (via a data-attr echo the JS layer can
           consult without re-parsing style). */
        transform:
          translateY(calc(var(--aftersign-return-lift-px, 0px) * -1))
          scale(var(--aftersign-return-halo-scale, 1));
        transition:
          transform
            var(--aftersign-return-settle-ms, 0ms)
            var(--aftersign-return-easing, linear)
            var(--aftersign-return-tone-attack-ms, 0ms),
          box-shadow
            var(--aftersign-return-tone-release-ms, 0ms)
            var(--aftersign-return-easing, linear);
        box-shadow:
          0 0 var(--aftersign-return-shake-px, 0px) rgba(255, 214, 138, var(--aftersign-return-tone-gain, 0));
      }

      /* Tap-confirm press envelope — SHIPPED CONSUMER of the 9
         --aftersign-tap-confirm-* variables (PR #1299 re-review:
         "zero CSS reads the stamped envelope" — fixed here). Mirrors
         the return-tone precedent above: the JS writer stamps the
         nine vars + `data-aftersign-tap-confirm="armed"` onto the
         single button the finger just touched, and this rule turns
         those numbers into paint. Base `button` selector already
         ships a transform+transition; the armed selector below has
         higher specificity (attribute + tag) so its tuned timing
         and easing wins during the commit envelope, then decays back
         to the base rule when the dataset marker is removed.

         Every one of the nine variables is consulted here:
           press-scale     → :active transform target
           release-scale   → non-active transform target
           press-ms        → transform transition on :active
           release-ms      → transform transition on release
           release-easing  → shared easing for both directions
           glow-px         → box-shadow spread on :active
           glow-ms         → box-shadow transition (both directions)
           shake-px + shake-ms → tap-confirm-shake keyframes below
         So a `pressMs: 72 → 73` edit in FLAGSHIP_TAP_CONFIRM_FEEL
         actually re-times the shipped press, not just a synthetic
         node in a vitest harness. */
      button[data-aftersign-tap-confirm="armed"] {
        transform: translate3d(0, 0, 0) scale(var(--aftersign-tap-confirm-release-scale, 1));
        transition:
          transform
            var(--aftersign-tap-confirm-release-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear),
          box-shadow
            var(--aftersign-tap-confirm-glow-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear);
        /* Play the shake once whenever the marker lands. The keyframes
           use --aftersign-tap-confirm-shake-px, so a 2px→3px edit lands
           on the shipped shake without re-authoring the rule. */
        animation:
          aftersign-tap-confirm-shake
          var(--aftersign-tap-confirm-shake-ms, 0ms)
          var(--aftersign-tap-confirm-release-easing, linear)
          1;
      }
      button[data-aftersign-tap-confirm="armed"]:active {
        transform: translate3d(0, 1px, 0) scale(var(--aftersign-tap-confirm-press-scale, 1));
        transition:
          transform
            var(--aftersign-tap-confirm-press-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear),
          box-shadow
            var(--aftersign-tap-confirm-glow-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear);
        box-shadow:
          0 0 var(--aftersign-tap-confirm-glow-px, 0px) rgba(122, 231, 255, 0.56),
          inset 0 0 18px rgba(120, 233, 255, 0.12);
      }

      @keyframes aftersign-tap-confirm-shake {
        0%   { translate: 0 0; }
        25%  { translate: var(--aftersign-tap-confirm-shake-px, 0px) 0; }
        50%  { translate: 0 0; }
        75%  { translate: calc(var(--aftersign-tap-confirm-shake-px, 0px) * -1) 0; }
        100% { translate: 0 0; }
      }

      /* Job-take press envelope — SHIPPED CONSUMER of the
         --aftersign-job-take-* variables that
         `applyAftersignJobTakeFeelToButton()` in main.js stamps onto
         every offer button carrying data-aftersign-job-take="ready".
         Mirrors the tap-confirm precedent above (PR #1649 re-review:
         "zero CSS reads --aftersign-job-take-scale-from" — fixed
         here). The JS writer stamps twelve vars; only the four the
         press-juice trip-wire keys off (scale-from during :active,
         scale-settle at rest, press easing, hold-ms transition) are
         wired to paint at first. The sibling
         aftersign-job-take-feel.playtest.spec.ts still passes because
         it only asserts the vars EXIST; this new rule turns
         scale-from into a real compressed bounding box during the
         96ms hold so aftersign-job-offer-press-juice's
         scaleDrop >= 0.015 assertion catches a genuinely painted
         envelope, not a stamped-but-invisible one.

         Base state (marker=ready or armed, finger up):
           transform: scale(scale-settle)  → identity at 1.0
         Pressed (marker="pressing", held by JS for holdMs):
           transform: scale(scale-from)    → compressed to 0.97

         PR #1649 re-review (Soren): `:active` cannot drive this
         envelope. Playwright's `touchscreen.tap()` dispatches
         touchstart+touchend in ~1ms, so `:active` lasts ~1ms — the
         transition toward scale-from barely starts (moves <1%)
         before `:active` ends and the return transition begins from
         ~0.9997, not 0.97. The e2e's 64ms sample landed on ~0
         scaleDrop. Fix is the JS `pressing` marker below (see the
         inline delegated pointerdown listener at end of <body>):
         `pointerdown` stamps `data-aftersign-job-take="pressing"`
         on the button and a `setTimeout(holdMs)` restores the prior
         value. Contact duration no longer gates compression depth —
         the CSS transition runs to completion inside the holdMs
         window because the marker is held there.

         PR #1649 re-review round 6 (Soren): naming divergence noted —
         the JS row's `settleScale: 1` field in
         apps/web/src/aftersign/aftersignJobTakeFeel.js maps to the
         `--aftersign-job-take-scale-settle` CSS var (main.js:451-452
         does the field → var-name translation). The divergence is
         cosmetic and intentional; do NOT rename either side in this
         PR — chasing it would touch the frozen feel row's public
         shape and the sibling
         aftersign-job-take-feel.playtest.spec.ts assertions. Left
         here so a future janitor doesn't "fix" the mismatch and
         cascade a rename through the harness surface. */
      button[data-aftersign-job-take="ready"],
      button[data-aftersign-job-take="armed"] {
        transform: scale(var(--aftersign-job-take-scale-settle, 1));
        transition:
          transform
            var(--aftersign-job-take-hold-ms, 0ms)
            var(--aftersign-job-take-easing-release, linear),
          box-shadow
            var(--aftersign-job-take-hold-ms, 0ms)
            var(--aftersign-job-take-easing-glow, linear);
        will-change: transform;
      }
      button[data-aftersign-job-take="pressing"] {
        transform: scale(var(--aftersign-job-take-scale-from, 1));
        /* #1663: `hold-ms` keeps the marker alive for the full press
           envelope; it cannot also be the press-in duration. A touch
           tap returns after touchend, leaving the canonical 64ms sample
           mid-transition when compression takes all 96ms. Reach the
           authored scale in 24ms; preserve the existing 96ms hold and
           release path. */
        transition:
          transform 24ms var(--aftersign-job-take-easing-press, linear),
          box-shadow
            var(--aftersign-job-take-hold-ms, 0ms)
            var(--aftersign-job-take-easing-glow, linear);
        box-shadow:
          0 var(--aftersign-job-take-shadow-lift-px, 0px)
            calc(var(--aftersign-job-take-shadow-lift-px, 0px) * 2)
            rgba(122, 231, 255, 0.32),
          inset 0 0 18px rgba(120, 233, 255, 0.14);
        will-change: transform;
      }
      @media (prefers-reduced-motion: reduce) {
        /* Reduced-motion users still get a state marker (so
           dependent CSS elsewhere keys off it correctly) but the
           scale channel collapses — no compression paint. The
           press-juice spec is not gated on this branch. */
        button[data-aftersign-job-take="ready"],
        button[data-aftersign-job-take="armed"],
        button[data-aftersign-job-take="pressing"] {
          transform: none;
          transition: box-shadow
            var(--aftersign-job-take-hold-ms, 0ms)
            var(--aftersign-job-take-easing-glow, linear);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #182033 0%, #05070c 65%);
        touch-action: manipulation;
      }

      /* Rain rim — a soft top-edge sheen the recognition beat brightens.
         --recognition-rain-rim-alpha 0 → invisible; up to ~0.28 during beat. */
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto 0;
        height: 42vh;
        pointer-events: none;
        background: linear-gradient(180deg,
          rgba(173, 216, 255, calc(var(--recognition-rain-rim-alpha) * 1)) 0%,
          rgba(173, 216, 255, 0) 100%);
        mix-blend-mode: screen;
        z-index: 0;
        transition: none;
      }

      /* Io-recognition vignette — the snippet-authored vignetteAlpha
         darkens the screen edges when Io recognizes the returning
         player. Off-beat --io-recognition-vignette-alpha === 0 ⇒
         invisible; deep-recall pushes it to 0.18. Fades in over the
         snippet's line-reveal window so the vignette blooms in step
         with the line the selector chose. */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 55%,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.9) 100%);
        opacity: var(--io-recognition-vignette-alpha);
        z-index: 1;
        transition:
          opacity var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms);
        mix-blend-mode: multiply;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: pointer;
        touch-action: none;
      }

      .hud {
        position: fixed;
        inset: auto 0 0 0;
        padding: 18px max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        pointer-events: none;
        background:
          linear-gradient(0deg,
            rgba(255, 176, 96, calc(var(--recognition-warmth) * 0.22)) 0%,
            rgba(255, 176, 96, 0) 62%),
          linear-gradient(0deg, rgba(2, 5, 10, 0.86) 0%, rgba(2, 5, 10, 0.5) 58%, rgba(2, 5, 10, 0) 100%);
        transform: translate3d(var(--confirm-shake-x), var(--confirm-shake-y), 0);
        will-change: transform;
      }

      .failure-sting {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(circle at 50% 60%, rgba(255, 93, 128, 0.24) 0%, rgba(255, 58, 96, 0.18) 28%, rgba(0, 0, 0, 0) 72%);
        mix-blend-mode: screen;
      }

      .panel {
        position: relative;
        width: min(680px, 100%);
        border: 1px solid rgba(119, 232, 255, 0.34);
        border-radius: 18px;
        padding: 16px;
        background: rgba(5, 10, 19, 0.72);
        /* Bloom halo — additive glow modulated by the snippet's
           bloomAlpha. Off-beat → 0 (invisible). deep-recall → 0.16.
           The warm ring's alpha is PRE-RESOLVED in JS
           (main.js :: applyIoRecognitionFeelCueVars writes
           --io-recognition-bloom-ring-alpha = min(1, bloomAlpha*3.6))
           because calc() inside a color function's alpha slot is not
           reliably supported: engines that reject it invalidate the
           WHOLE box-shadow declaration, the warm ring vanishes, and
           the e2e bloom regex reds out — the recurring CI failure on
           this PR. A plain-number var in legacy rgba() parses on every
           engine. Deep-recall (0.16 → 0.576) serializes as
           `rgba(255, 214, 151, 0.576)` or the Color-4 space/slash form
           depending on the browser — the spec accepts both. */
        box-shadow:
          0 0 40px rgba(0, 204, 255, 0.12),
          inset 0 0 30px rgba(22, 89, 130, 0.14),
          0 0 calc(var(--io-recognition-bloom-alpha) * 120px)
            rgba(255, 214, 151, var(--io-recognition-bloom-ring-alpha));
        backdrop-filter: blur(12px);
        /* Compose the io-recognition camera-dolly + yaw on top of the
           haptic-scale so the recognition-beat feels like the camera
           pushes in and tilts toward the NPC on the same panel that
           already carries the haptic pop.  cameraDollyCm → translateZ
           (px in DOM space; scale 0.6 keeps deep-recall's 18cm value
           to a ~10px push — perceptible on the panel proxy but not
           motion-sickness-inducing).  cameraYawDegrees → rotateY.
           Perspective set on the .hud parent below so the transform
           reads as depth, not just a 2D shear.  Transition uses the
           snippet's reveal window so the dolly lands in time with
           the line copy. */
        transform:
          scale(var(--recognition-haptic-scale))
          translateZ(calc(var(--io-recognition-camera-dolly-cm) * 0.6px))
          rotateY(calc(var(--io-recognition-camera-yaw-deg) * 1deg));
        transform-origin: 50% 100%;
        transition:
          transform var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms),
          box-shadow var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms);
        will-change: transform, box-shadow;
      }

      /* .hud gives .panel a perspective context so translateZ + rotateY
         read as depth. transform-style: preserve-3d is required because
         .hud itself carries a translate3d(shake), which would otherwise
         flatten .panel's translateZ back onto the 2D plane. Perspective
         is modest (1600px) so the yaw stays subtle even at the
         deep-recall tier's 4.5° authored value.

         The background gradient (rgba warm-underglow) transitions over
         --io-recognition-duration-ms so the HUD's warmth wash rides the
         full recognition-beat envelope, not just the line-reveal window. */
      .hud {
        perspective: 1600px;
        perspective-origin: 50% 100%;
        transform-style: preserve-3d;
        transition: background var(--io-recognition-duration-ms)
          var(--io-recognition-easing);
      }

      .speaker {
        margin: 0 0 8px;
        color: #78e9ff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .line {
        margin: 0;
        font-size: clamp(17px, 3.6vw, 24px);
        line-height: 1.32;
        text-wrap: balance;
        /* Line-reveal — the snippet's per-tier delay + duration + easing
           choreograph how the recognition line settles in. Off-beat both
           values are 0ms so this is a no-op; at the recognition beat the
           selector-chosen tier's timing lands on the element (deep-recall
           = 180ms delay + 540ms duration; returning = 140ms + 420ms;
           first-meeting = 80ms + 260ms). letter-spacing + opacity are
           the reveal channels — small enough to be tasteful, real
           enough that CSS consumes ALL three reveal vars. */
        transition:
          opacity var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms),
          letter-spacing var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms);
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
        pointer-events: auto;
      }

      .move-pad {
        position: fixed;
        left: max(18px, env(safe-area-inset-left));
        /* The pad must clear the bottom .hud panel or the panel's
           `.controls` (pointer-events: auto) swallow the drag that is
           supposed to start on the pad — the .hud paints above the pad
           (later in DOM order, both fixed, no z-index) and its height
           varies per beat with dialogue + tray content. 146px was the
           static clearance tuned for the #1029-era panel; the panel
           has since outgrown it (PR #1555's route/risk copy pushed
           `.controls` over the pad's center on CI font metrics — pad
           visible, taps dead). --aftersign-hud-height is kept live by
           the ResizeObserver in main.js (syncMovePadClearance); the
           146px terms stay as the floor for the pre-boot frame and
           any environment without ResizeObserver. */
        bottom: max(
          146px,
          calc(env(safe-area-inset-bottom) + 146px),
          calc(var(--aftersign-hud-height, 128px) + 14px)
        );
        width: 116px;
        height: 116px;
        border: 1px solid rgba(173, 242, 255, 0.32);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 50%, rgba(120, 233, 255, 0.16), rgba(7, 20, 35, 0.68) 62%, rgba(2, 6, 12, 0.76));
        box-shadow: 0 0 28px rgba(0, 204, 255, 0.12), inset 0 0 22px rgba(120, 233, 255, 0.09);
        pointer-events: auto;
        touch-action: none;
        opacity: 0.88;
      }

      .move-pad[data-active="true"] {
        opacity: 1;
        border-color: rgba(255, 214, 151, 0.58);
        box-shadow: 0 0 34px rgba(255, 184, 107, 0.16), inset 0 0 24px rgba(120, 233, 255, 0.14);
      }

      .move-pad-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 42px;
        height: 42px;
        margin: -21px 0 0 -21px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(237, 247, 255, 0.92), rgba(120, 233, 255, 0.64));
        box-shadow: 0 0 18px rgba(120, 233, 255, 0.24);
        transform: translate3d(0, 0, 0);
        will-change: transform;
      }

      .route-choice {
        display: none;
        flex-basis: 100%;
        align-items: center;
        gap: 8px;
        color: rgba(237, 247, 255, 0.76);
        font-size: 12px;
        letter-spacing: 0.03em;
      }

      .route-choice[data-visible="true"] {
        display: flex;
      }

      .route-choice-label {
        margin-right: 2px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: rgba(120, 233, 255, 0.82);
      }

      button {
        border: 1px solid rgba(173, 242, 255, 0.4);
        border-radius: 999px;
        padding: 11px 14px;
        color: #edf7ff;
        background: rgba(8, 28, 43, 0.85);
        box-shadow: 0 0 20px rgba(0, 204, 255, 0.1);
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transform: translate3d(0, 0, 0) scale(1);
        transition:
          transform 84ms cubic-bezier(.2,.8,.2,1),
          box-shadow 140ms cubic-bezier(.2,.8,.2,1),
          border-color 140ms cubic-bezier(.2,.8,.2,1),
          filter 140ms cubic-bezier(.2,.8,.2,1);
        will-change: transform;
      }

      button:focus-visible {
        outline: none;
        border-color: rgba(255, 214, 151, 0.88);
        box-shadow:
          0 0 0 3px rgba(255, 214, 151, 0.18),
          0 0 24px rgba(0, 204, 255, 0.16);
      }

      button:active {
        transform: translate3d(0, 1px, 0) scale(0.975);
        filter: brightness(1.14);
        box-shadow:
          0 0 12px rgba(0, 204, 255, 0.16),
          inset 0 0 18px rgba(120, 233, 255, 0.12);
      }

      .packet-button {
        position: relative;
        overflow: hidden;
        box-shadow:
          0 0 20px rgba(0, 204, 255, 0.1),
          0 0 var(--recognition-seal-glow) rgba(255, 202, 138, 0.55);
      }

      .packet-button::after {
        content: "";
        position: absolute;
        inset: 0;
        width: calc(var(--packet-progress) * 100%);
        background: linear-gradient(90deg, rgba(120, 233, 255, 0.2), rgba(255, 184, 107, 0.28));
        pointer-events: none;
        transition: width 40ms linear;
      }

      .packet-button span {
        position: relative;
        z-index: 1;
        display: inline-block;
        transform: translate3d(0, var(--confirm-reticle-y), 0) scale(var(--confirm-reticle-scale));
        transition: transform 84ms cubic-bezier(.2,.8,.2,1);
      }

      .packet-button:active span {
        transform: translate3d(0, 1px, 0) scale(0.99);
      }

      /* Recognition impact-burst overlay (#1104). Absolute-positioned
         container anchored near the on-screen NPC-eye position; the
         render tick in main.js reconciles child `.impact-burst-particle`
         nodes to `envelope.impactBurst.particles` on every frame, so a
         14-particle radial burst spawns for ~260ms starting at frame 4
         of the eye-open animation. Empty envelope ⇒ zero children.
         Kept purely DOM (not canvas) so the visual-feel e2e can count
         primitives with `document.querySelectorAll`. */
      .impact-burst {
        position: fixed;
        left: 50%;
        top: 34vh;
        width: 0;
        height: 0;
        pointer-events: none;
        z-index: 2;
      }

      .impact-burst-particle {
        position: absolute;
        left: 0;
        top: 0;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 999px;
        background: radial-gradient(circle at 50% 50%,
          rgba(255, 236, 190, 0.95) 0%,
          rgba(255, 202, 138, 0.72) 45%,
          rgba(255, 176, 96, 0) 100%);
        box-shadow: 0 0 8px rgba(255, 214, 151, 0.7);
        mix-blend-mode: screen;
        will-change: transform, opacity;
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .impact-burst-particle { display: none; }
      }

      .state-readout {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        margin: 0;
        padding: 8px 10px;
        border-radius: 999px;
        color: rgba(237, 247, 255, 0.74);
        background: rgba(3, 7, 13, 0.58);
        font-size: 12px;
        letter-spacing: 0.04em;
        /* Kiosk-sign glow — the readout is the on-page proxy for the sign;
           --recognition-sign-glow bumps it during the recognition beat. */
        box-shadow: 0 0 var(--recognition-sign-glow) rgba(120, 233, 255, 0.55);
      }

      @media (prefers-reduced-motion: reduce) {
        button,
        .packet-button span {
          transition: none;
        }

        button:active {
          transform: none;
        }

        /* Tap-confirm envelope respects reduced-motion — the marker
           still lands (so state-driven CSS elsewhere can key off it)
           and the glow still paints (a crisp acknowledgement), but
           the scale + shake channels collapse. Same discipline as
           the .hud / .panel / .line / body::after block below. */
        button[data-aftersign-tap-confirm="armed"],
        button[data-aftersign-tap-confirm="armed"]:active {
          transform: none;
          animation: none;
          transition: box-shadow
            var(--aftersign-tap-confirm-glow-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear);
        }

        .packet-button:active span {
          transform: translate3d(0, var(--confirm-reticle-y), 0) scale(var(--confirm-reticle-scale));
        }

        /* io-recognition envelope respects reduced-motion — the
           snippet-authored dolly/yaw/vignette/bloom timings collapse
           to instant, so recognition still LANDS (final state is the
           snippet's numbers) but doesn't ANIMATE. Mara #1139: the new
           transitions extended the pre-existing reduced-motion gap;
           this closes it on the same four consumers the e2e checks. */
        body::after,
        .panel,
        .line,
        .hud {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="AFTERSIGN first kiosk scene"></canvas>
    <div class="failure-sting" aria-hidden="true"></div>
    <div id="movePad" class="move-pad" data-active="false" aria-label="Move Io's courier" role="application">
      <div id="movePadKnob" class="move-pad-knob" aria-hidden="true"></div>
    </div>

      apps/web/src/aftersign/aftersignSceneTransitionFeel.ts).

      id="aftersignSceneTransitionSurface"

    <p class="state-readout" id="stateReadout">story: packet-offered · memory: pending</p>
    <section class="hud" aria-live="polite">
      <div class="panel">
        <p class="speaker" id="speaker">Io</p>
        <p class="line" id="line">Keep it sealed if you want the city to trust you. I will remember which version of you touches that blue kiosk.</p>
        <div class="controls">
          <!--
            data-aftersign-tap-choice: names the buttons that COMMIT a

           #1549 aftersign-job-take feel — each offer button ALSO
           carries:
             data-aftersign-job-take         "ready" | "armed"
             data-aftersign-job-take-action  the memory-gated mloop
                                             action id (e.g.
                                             "mloop-safe-delivery-take")
           stamped by main.js's
           `applyAftersignJobTakeFeelToButton()` via
           `resolveAftersignJobTakeFeel({actionId, route, risk})`.
           The `[data-aftersign-job-take]` locator is what the
           sibling e2e `aftersign-job-take-feel.playtest.spec.ts`
           real-taps (played, not driven) and what CSS overlays

          <div id="offeredJobs" class="route-choice" data-visible="false" data-aftersign-offered-jobs-surface aria-label="Choose the next packet Io hands you">

    <!--
      PR #1649 re-review (Soren) — JS `pressing` marker.

      Why: the CSS press envelope for `[data-aftersign-job-take]`
      cannot be triggered by `:active` on a Playwright
      `touchscreen.tap()`. The tap dispatches touchstart+touchend
      in ~1ms, so `:active` lasts ~1ms — the transition toward
      scale-from barely starts before the return begins. The e2e
      trip-wire `aftersign-job-offer-press-juice.playtest.spec.ts`
      samples at 64ms and needs the button to still be compressed;
      that requires the pressed marker to be held for `holdMs`
      (96ms in `aftersignJobTakeFeel`), independent of finger
      contact duration.

      What: a delegated `pointerdown` listener on `document`.
      When the target is a `[data-aftersign-job-take]` button, we
      save the prior state (`ready` or `armed`), stamp
      `data-aftersign-job-take="pressing"`, and schedule a
      restore via `setTimeout(holdMs)`. The CSS rule for
      `[data-aftersign-job-take="pressing"]` above holds
      `transform: scale(scale-from)` for the full window, so the
      e2e's 64ms sample lands INSIDE the compressed envelope.

      Held state precedence: if `applyAftersignJobTakeFeelToButton()`
      re-stamps the marker to `"armed"` DURING the press window
      (the click handler in main.js does this), the restore-to-
      prior at holdMs would clobber `"armed"` back to `"ready"`.
      We read the CURRENT `data-aftersign-job-take` at restore
      time — if the value is still `"pressing"` we restore to the
      prior we captured; if it's already something else (armed,
      or removed), we leave it. Read on restore, not on
      pointerdown.

      Reduced motion: the CSS rule already collapses transform
      for `prefers-reduced-motion: reduce`, so this listener still
      runs (state marker stays consistent for any dependent CSS)
      but paints no compression. The press-juice spec is not
      gated on the reduced-motion branch.

      Why inline: this must run before the very first tap; a
      user could theoretically tap the offer within one frame of
      `main.js`'s `resolveAftersignJobTakeFeel(...)` stamping the
      button. An inline listener wins that race with zero import
      cost.

      hold-ms lookup: the writer stamps
      `--aftersign-job-take-hold-ms` as `<n>ms` on the element's
      inline style (see `applyAftersignJobTakeFeelToButton` in
      main.js). We `parseFloat` it via `getPropertyValue()`; if
      missing (unstamped button, defensive fallback), we use the
      frozen `AFTERSIGN_JOB_TAKE_FEEL.holdMs` of 96ms.
    -->
    <script>
      (function () {
        var FALLBACK_HOLD_MS = 96;

        // #1658 — same-id replacement inherit map. main.js re-renders
        // `#offeredJobs` after the click advances state; the physical
        // <button> node whose pointerdown we just stamped can be
        // detached and replaced by a fresh node reusing the same
        // `id` before the holdMs window elapses. Without this map,
        // the replacement mounts at identity scale (no
        // `data-aftersign-job-take="pressing"` marker) and
        // scaleDrop momentarily reads 0 — exactly what
        // aftersign-job-offer-press-juice.playtest.spec.ts flagged.
        //
        // Shape: { [buttonId]: { until: epochMs, prior: "ready" | "armed" } }
        // - `until`  → epoch ms when the original hold expires; a
        //   same-id inherit uses `Math.max(0, until - now)` as its
        //   remaining hold budget, so total compression time across
        //   the swap equals a single holdMs window (not doubled).
        // - `prior`  → the state we captured from the ORIGINAL node
        //   at pointerdown. The replacement's own attribute may read
        //   `ready` again (main.js writes it fresh); we restore to
        //   the ORIGINAL prior so a mid-hold transition (e.g.
        //   ready→armed) still lands after the compression envelope.
        //
        // Cleanup: the setTimeout below deletes the entry when the
        // hold expires, so a stale record can't shadow a later press
        // on the same id.  `Object.create(null)` avoids prototype
        // key collisions with an id like "toString".
        var inFlight = Object.create(null);

        function resolveHoldMs(el) {
          try {
            var raw = el.style && typeof el.style.getPropertyValue === "function"
              ? el.style.getPropertyValue("--aftersign-job-take-hold-ms")
              : "";
            var n = parseFloat(raw);
            if (Number.isFinite(n) && n > 0) return n;
          } catch (_err) {
            /* fall through */
          }
          return FALLBACK_HOLD_MS;
        }

        function armPressing(button) {
          if (!button || typeof button.getAttribute !== "function") return;
          var prior = button.getAttribute("data-aftersign-job-take");
          // Only meaningful states — ignore already-pressing (a
          // second pointerdown inside the hold) and empty/unknown.
          if (prior !== "ready" && prior !== "armed") return;
          var holdMs = resolveHoldMs(button);

          // #1658 — READ side of the inFlight map. If a prior press
          // on a node with the SAME id is still mid-hold (main.js
          // re-rendered #offeredJobs and mounted a fresh node whose
          // pointerdown we're now seeing, OR the same physical node
          // is being re-pressed after a swap), inherit two things
          // from the original press:
          //   1. `prior` — restore to the ORIGINAL captured state
          //      when the compression window ends, not the fresh
          //      node's current attr (which main.js just wrote to
          //      "ready" and would otherwise clobber an "armed"
          //      intent that predated the swap).
          //   2. remaining hold budget — so the total compressed
          //      envelope across the swap equals a single holdMs
          //      window, not two stacked windows (which would
          //      over-hold the pressing marker and delay the
          //      restore visibly past the design 96ms).
          // If the entry has already expired (defensive: setTimeout
          // hasn't fired yet due to event loop scheduling), fall
          // through to a normal fresh press.
          var now = Date.now();
          if (button.id && inFlight[button.id]) {
            var live = inFlight[button.id];
            var remaining = live.until - now;
            if (remaining > 0) {
              prior = live.prior;
              holdMs = remaining;
            }
          }

          try {
            button.setAttribute("data-aftersign-job-take", "pressing");
          } catch (_err) {
            return;
          }

          // #1663 re-review (Soren, round 2): the `pressing` selector
          // depends on the CSS transition to compress toward
          // `scale(--aftersign-job-take-scale-from)` over 24ms. The
          // e2e still measured `received 0` — the transition either
          // fails to start (var-cascade timing on the phone project)
          // or is clobbered before the 64ms sample paints. Belt-and-
          // suspenders: stamp the compressed transform INLINE on the
          // button so `getBoundingClientRect()` returns the target
          // scale from the very first frame after pointerdown, no
          // transition required. Inline style has higher specificity
          // than the rule set, so this wins during the hold; the
          // setTimeout restore below clears it
          // (`button.style.transform = ""`) so the rule on the
          // `ready` / `armed` selector takes over again for the
          // release path. Reads scale-from from computed style
          // (main.js already stamped it as a CSS var), falls back to
          // the frozen 0.97 from `AFTERSIGN_JOB_TAKE_FEEL` so the
          // envelope still paints on a defensive-fallback button.
          // Skipped when the user opted into reduced motion — the
          // @media rule already collapses transform there and the
          // press-juice spec is not gated on that branch.
          try {
            var reducedMotion = false;
            if (typeof window !== "undefined" &&
                typeof window.matchMedia === "function") {
              var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
              reducedMotion = !!(mq && mq.matches);
            }
            if (!reducedMotion) {
              var scaleFromRaw = "";
              if (typeof window !== "undefined" &&
                  typeof window.getComputedStyle === "function") {
                var cs = window.getComputedStyle(button);
                if (cs && typeof cs.getPropertyValue === "function") {
                  scaleFromRaw = cs.getPropertyValue("--aftersign-job-take-scale-from");
                }
              }
              var scaleFrom = parseFloat(scaleFromRaw);
              if (!isFinite(scaleFrom) || scaleFrom <= 0) {
                scaleFrom = 0.97; // frozen fallback from aftersignJobTakeFeel.js
              }
              button.style.transform = "scale(" + scaleFrom + ")";
            }
          } catch (_styleErr) {
            /* inline stamp is belt-and-suspenders; a throw here must
               not undo the marker + observer that already landed. */
          }
          // #1658 — WRITE side of the inFlight map. Record the
          // in-flight press by element id so a same-id replacement
          // node (main.js re-renders #offeredJobs after the click
          // advances state) inherits the remaining hold + original
          // prior via the READ block above, instead of appearing at
          // identity scale mid-hold. The setTimeout at the tail of
          // this function deletes the entry when the hold expires.
          if (button.id) {
            inFlight[button.id] = { until: now + holdMs, prior: prior };
          }

          // PR #1649 re-review (Soren): the click handler in
          // main.js (`onOfferClick` → `applyAftersignJobTakeFeelToButton`
          // at main.js:2076) synchronously re-stamps
          // `data-aftersign-job-take="armed"` within ~1ms of
          // pointerdown under Playwright's `touchscreen.tap()`, so
          // the CSS transition toward `scale-from` is interrupted
          // before it can travel meaningfully. The prior fix only
          // guarded the *restore* path — nothing prevented the
          // click-time "armed" write from clobbering "pressing"
          // mid-hold.
          //
          // Defer the "armed" transition until the compression has
          // held for its full 96ms. During the hold window we:
          //   (a) observe attribute mutations on this button via
          //       MutationObserver. Any external writer that flips
          //       `data-aftersign-job-take` to a non-"pressing"
          //       value has its intent recorded on `pendingIntent`
          //       and the attribute is re-stamped to "pressing"
          //       synchronously inside the observer callback. The
          //       observer callback runs as a microtask BEFORE
          //       style/layout/paint (HTML spec: the "perform a
          //       microtask checkpoint" step happens before the
          //       rendering steps of the event loop), so the browser
          //       never paints the interrupted state — the CSS
          //       transition toward scale-from runs uninterrupted.
          //   (b) once holdMs elapses, disconnect the observer and
          //       apply the pending intent (or restore `prior` if
          //       nothing else asked to write during the hold).
          //
          // The click callback in main.js still runs its side effects
          // (state transitions, memory writes, next beat) — only the
          // DOM marker's compression window is protected. This
          // implements Soren's proposed "stamp 'armed' after holdMs"
          // fix at the DOM layer so no coupling with main.js's writer
          // is needed.
          var pendingIntent = null;
          var observer = null;
          if (typeof MutationObserver === "function") {
            observer = new MutationObserver(function (records) {
              try {
                for (var i = 0; i < records.length; i += 1) {
                  var record = records[i];
                  if (record.attributeName !== "data-aftersign-job-take") continue;
                  var value = button.getAttribute("data-aftersign-job-take");
                  if (value === "pressing" || value === null) continue;
                  // External writer tried to flip us out of the
                  // compression window. Remember its intent for
                  // post-hold, and re-assert "pressing" before the
                  // frame paints.
                  pendingIntent = value;
                  button.setAttribute("data-aftersign-job-take", "pressing");
                }
              } catch (_err) {
                /* observer callback MUST NOT throw */
              }
            });
            try {
              observer.observe(button, {
                attributes: true,
                attributeFilter: ["data-aftersign-job-take"],
              });
            } catch (_err) {
              observer = null;
            }
          }

          setTimeout(function () {
            try {
              if (observer && typeof observer.disconnect === "function") {
                observer.disconnect();
              }
              // #1658 — release the inFlight slot for this id so a
              // later press on the same id starts a fresh envelope
              // rather than inheriting an expired remaining-hold of
              // ~0ms (which would render the press marker invisibly
              // short). Guarded on button.id to match the write
              // site's guard above.
              if (button.id && inFlight[button.id]) {
                delete inFlight[button.id];
              }
              var current = button.getAttribute("data-aftersign-job-take");
              // Priority order for the post-hold state:
              //   1. Pending intent from a deferred external write
              //      (e.g. click flipped to "armed" during the hold).
              //      Apply it now — the beat has already advanced in
              //      main.js, we're only catching up the DOM marker
              //      so the recovery paint runs and the e2e's
              //      recovered-scale sample lands on the intended
              //      final state.
              //   2. If nothing external wrote and we're still
              //      "pressing", restore the prior marker so the
              //      button decays back to its at-rest scale.
              //   3. If external writes landed AFTER the observer
              //      disconnected (a very late click), leave them.
              if (pendingIntent !== null) {
                button.setAttribute("data-aftersign-job-take", pendingIntent);
              } else if (current === "pressing") {
                button.setAttribute("data-aftersign-job-take", prior);
              }

              // #1663 re-review: unwind the inline compression stamped
              // at pointerdown so the base `ready`/`armed` rule takes
              // over the release path. Clearing to "" hands the
              // transform back to the CSS cascade (scale-settle → 1.0)
              // rather than pinning it at the pressed value forever.
              // Guarded by a try/catch so a detached node (main.js
              // re-rendered #offeredJobs mid-hold) doesn't red the
              // observer teardown that follows.
              try {
                if (button && button.style) {
                  button.style.transform = "";
                }
              } catch (_clearErr) {
                /* release path stays soft — the marker restore above
                   has already landed. */
              }
            } catch (_err) {
              /* swallow — feel projection MUST NOT throw */
            }
          }, holdMs);
        }

        function onPointerDown(event) {
          var target = event.target;
          if (!target || typeof target.closest !== "function") return;
          var button = target.closest("button[data-aftersign-job-take]");
          if (!button) return;
          armPressing(button);
        }

        // Use pointerdown (fires for touch + mouse + pen); passive
        // so we never delay scroll. Delegated on document so
        // dynamically rendered offer buttons are covered without a
        // rewire on every render.
        document.addEventListener("pointerdown", onPointerDown, { passive: true, capture: true });

        // #1661 — ADOPTION side of the inFlight map (the missing half
        // of the #1658/#1660 inherit design). The click that follows
        // pointerdown advances the beat and main.js re-renders
        // #offeredJobs, REPLACING the pressed node mid-hold. The
        // replacement mounts at identity scale with marker "ready";
        // the inherit map only activated on a SECOND pointerdown that
        // never comes, and the #1663 inline transform sits on the
        // now-DETACHED original — so the e2e's 64ms same-id sample
        // reads scaleDrop 0 (the exact red on main this fixes).
        // Watch childList mutations; when a button whose id is
        // mid-hold in `inFlight` mounts, run it through armPressing —
        // whose existing inherit path stamps the pressing marker +
        // inline compression for the REMAINING hold budget and
        // restores the ORIGINAL prior afterward. Feel-only: the
        // observer callback must never throw.
        if (typeof MutationObserver === "function") {
          var mountObserver = new MutationObserver(function (records) {
            try {
              var now = Date.now();
              for (var i = 0; i < records.length; i += 1) {
                var added = records[i].addedNodes;
                for (var j = 0; j < added.length; j += 1) {
                  var node = added[j];
                  if (!node || node.nodeType !== 1) continue;
                  var candidates = [];
                  if (typeof node.matches === "function" &&
                      node.matches("button[data-aftersign-job-take]")) {
                    candidates.push(node);
                  }
                  if (typeof node.querySelectorAll === "function") {
                    var inner = node.querySelectorAll("button[data-aftersign-job-take]");
                    for (var k = 0; k < inner.length; k += 1) candidates.push(inner[k]);
                  }
                  for (var c = 0; c < candidates.length; c += 1) {
                    var btn = candidates[c];
                    if (btn.id && inFlight[btn.id] && inFlight[btn.id].until > now) {
                      armPressing(btn);
                    }
                  }
                }
              }
            } catch (_err) {
              /* adoption is a feel projection — MUST NOT throw */
            }
          });
          try {
            mountObserver.observe(document.body, { childList: true, subtree: true });
          } catch (_err) {
            /* no adoption on an exotic DOM — pointerdown path still works */
          }
        }
      })();
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
