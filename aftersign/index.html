<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AFTERSIGN — Kiosk Slice</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05070c;
        color: #edf7ff;
        --confirm-shake-x: 0px;
        --confirm-shake-y: 0px;
        --confirm-reticle-scale: 1;
        --confirm-reticle-y: 0px;
        --packet-progress: 0;
        --recognition-sign-glow: 0px;
        --recognition-seal-glow: 0px;
        --recognition-rain-rim-alpha: 0;
        --recognition-haptic-scale: 1;
        --recognition-warmth: 0;
        /* --io-recognition-* — snippet-authored per-tier motion values
           the dialogue selector picks and main.js writes onto this
           element (see aftersign/main.js :: applyIoRecognitionFeelCueVars).
           Zeroed off-beat; populated at the io-return-recognition beat
           from the SAME snippet that supplies lastLine + memoryRefs.
           The CSS rules below (body::after vignette, .panel dolly/yaw,
           .line reveal transition) consume them so the tier the
           selector chose actually shapes what the player sees — not a
           closed loop, a wired one. */
        --io-recognition-duration-ms: 0ms;
        --io-recognition-camera-dolly-cm: 0;
        --io-recognition-camera-yaw-deg: 0;
        --io-recognition-vignette-alpha: 0;
        --io-recognition-bloom-alpha: 0;
        /* Resolved warm-ring alpha (bloomAlpha * 3.6, clamped to 1) —
           PRE-MULTIPLIED IN JS (applyIoRecognitionFeelCueVars) so the
           .panel box-shadow color never needs calc() inside a color
           function. calc()-in-alpha is not grammar-safe across engines;
           when the engine rejects it the ENTIRE box-shadow declaration
           invalidates and the warm ring silently vanishes — the
           recurring bloom-regex CI failure on PR #1139. A plain number
           var substitutes cleanly into legacy rgba() everywhere. */
        --io-recognition-bloom-ring-alpha: 0;
        --io-recognition-line-reveal-delay-ms: 0ms;
        --io-recognition-line-reveal-duration-ms: 0ms;
        --io-recognition-easing: linear;

        /* --aftersign-return-* — return-tone choice feel envelope
           (see apps/web/src/aftersign/returnToneChoiceFeel.ts). Stamped
           onto the [data-aftersign-return-surface] node by main.js at
           the io-return-recognition beat via
           window.__game.applyReturnToneFeel(reason); the same reason
           token (kind / evasive / blunt) drives Io's voice memory
           thread. Defaults here are inert so the rule below still
           parses when the surface is un-hidden but no beat has fired
           yet — the rule reads through the cascade. */
        --aftersign-return-press-ms: 0ms;
        --aftersign-return-lift-px: 0px;
        --aftersign-return-settle-ms: 0ms;
        --aftersign-return-easing: linear;
        --aftersign-return-halo-scale: 1;
        --aftersign-return-halo-fade-ms: 0ms;
        --aftersign-return-shake-px: 0px;
        --aftersign-return-tone-hz: 0;
        --aftersign-return-tone-attack-ms: 0ms;
        --aftersign-return-tone-release-ms: 0ms;
        --aftersign-return-tone-gain: 0;

        /* --aftersign-tap-confirm-* — flagship per-commit press
           envelope (see apps/web/src/aftersign/tapConfirmFeel.ts).
           Stamped onto the tapped [data-aftersign-tap-choice] button
           by main.js ::  window.__game.applyTapConfirmFeel(choiceId)
           at the moment a fork COMMITS (packet pointerup, ack/skip
           route, deliver). Nine numbers, one row: pressScale ·
           releaseScale · pressMs · releaseMs · releaseEasing · glowPx
           · glowMs · shakePx · shakeMs. Defaults here are inert
           (identity transform, zero-duration transitions, no glow)
           so the base `button` rule's own transform+transition wins
           until `data-aftersign-tap-confirm="armed"` lands — then the
           tuned row overrides on the tapped button and only that
           button. Same discipline as the return-tone precedent above:
           the CSS layer parses cleanly with or without a beat firing,
           and a `pressMs: 72 → 73` edit in the JS row actually
           re-times the shipped surface. */
        --aftersign-tap-confirm-press-scale: 1;
        --aftersign-tap-confirm-release-scale: 1;
        --aftersign-tap-confirm-press-ms: 0ms;
        --aftersign-tap-confirm-release-ms: 0ms;
        --aftersign-tap-confirm-release-easing: linear;
        --aftersign-tap-confirm-glow-px: 0px;
        --aftersign-tap-confirm-glow-ms: 0ms;
        --aftersign-tap-confirm-shake-px: 0px;
        --aftersign-tap-confirm-shake-ms: 0ms;
      }

      /* Return-tone press envelope — SHIPPED CONSUMER of the 11
         --aftersign-return-* variables (PR #1205 re-review: "zero CSS
         rules read any --aftersign-return-* variable" — fixed here).
         The surface is `hidden` today so no pixels move, but the
         moment the "why did you come back?" beat un-hides it (or a
         descendant opts into these vars), the tuned envelope is
         already what the browser paints — no CSS work required at
         wire-up time. Every one of the 11 CSS variables the writer
         stamps is consulted here so a `pressMs: 72 → 73` edit
         actually re-times the shipped surface. */
      [data-aftersign-return-surface] {
        transform: translateY(0) scale(var(--aftersign-return-halo-scale, 1));
        transition:
          transform var(--aftersign-return-press-ms, 0ms) var(--aftersign-return-easing, linear),
          opacity var(--aftersign-return-halo-fade-ms, 0ms) var(--aftersign-return-easing, linear);
        /* Filter reads press energy from the audio-cue channel so the
           gain / release numbers land in the paint pipeline too. */
        filter:
          blur(calc(var(--aftersign-return-shake-px, 0px) * 0.25))
          brightness(calc(1 + var(--aftersign-return-tone-gain, 0) * 4));
      }
      [data-aftersign-return-surface][data-aftersign-return-tone] {
        /* Lift + settle + tone envelope: the y-offset uses the tuned
           lift-px (up), and the shake-px drives a subtle x-jitter via
           box-shadow spread so blunt (2px) and evasive (1.5px) reads
           differently from kind (0px). Timings ride the settle-ms
           tail so a change to that number visibly re-times the
           release. Reads all remaining vars: settle-ms, attack-ms,
           release-ms, tone-hz (via a data-attr echo the JS layer can
           consult without re-parsing style). */
        transform:
          translateY(calc(var(--aftersign-return-lift-px, 0px) * -1))
          scale(var(--aftersign-return-halo-scale, 1));
        transition:
          transform
            var(--aftersign-return-settle-ms, 0ms)
            var(--aftersign-return-easing, linear)
            var(--aftersign-return-tone-attack-ms, 0ms),
          box-shadow
            var(--aftersign-return-tone-release-ms, 0ms)
            var(--aftersign-return-easing, linear);
        box-shadow:
          0 0 var(--aftersign-return-shake-px, 0px) rgba(255, 214, 138, var(--aftersign-return-tone-gain, 0));
      }

      /* Tap-confirm press envelope — SHIPPED CONSUMER of the 9
         --aftersign-tap-confirm-* variables (PR #1299 re-review:
         "zero CSS reads the stamped envelope" — fixed here). Mirrors
         the return-tone precedent above: the JS writer stamps the
         nine vars + `data-aftersign-tap-confirm="armed"` onto the
         single button the finger just touched, and this rule turns
         those numbers into paint. Base `button` selector already
         ships a transform+transition; the armed selector below has
         higher specificity (attribute + tag) so its tuned timing
         and easing wins during the commit envelope, then decays back
         to the base rule when the dataset marker is removed.

         Every one of the nine variables is consulted here:
           press-scale     → :active transform target
           release-scale   → non-active transform target
           press-ms        → transform transition on :active
           release-ms      → transform transition on release
           release-easing  → shared easing for both directions
           glow-px         → box-shadow spread on :active
           glow-ms         → box-shadow transition (both directions)
           shake-px + shake-ms → tap-confirm-shake keyframes below
         So a `pressMs: 72 → 73` edit in FLAGSHIP_TAP_CONFIRM_FEEL
         actually re-times the shipped press, not just a synthetic
         node in a vitest harness. */
      button[data-aftersign-tap-confirm="armed"] {
        transform: translate3d(0, 0, 0) scale(var(--aftersign-tap-confirm-release-scale, 1));
        transition:
          transform
            var(--aftersign-tap-confirm-release-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear),
          box-shadow
            var(--aftersign-tap-confirm-glow-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear);
        /* Play the shake once whenever the marker lands. The keyframes
           use --aftersign-tap-confirm-shake-px, so a 2px→3px edit lands
           on the shipped shake without re-authoring the rule. */
        animation:
          aftersign-tap-confirm-shake
          var(--aftersign-tap-confirm-shake-ms, 0ms)
          var(--aftersign-tap-confirm-release-easing, linear)
          1;
      }
      button[data-aftersign-tap-confirm="armed"]:active {
        transform: translate3d(0, 1px, 0) scale(var(--aftersign-tap-confirm-press-scale, 1));
        transition:
          transform
            var(--aftersign-tap-confirm-press-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear),
          box-shadow
            var(--aftersign-tap-confirm-glow-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear);
        box-shadow:
          0 0 var(--aftersign-tap-confirm-glow-px, 0px) rgba(122, 231, 255, 0.56),
          inset 0 0 18px rgba(120, 233, 255, 0.12);
      }

      @keyframes aftersign-tap-confirm-shake {
        0%   { translate: 0 0; }
        25%  { translate: var(--aftersign-tap-confirm-shake-px, 0px) 0; }
        50%  { translate: 0 0; }
        75%  { translate: calc(var(--aftersign-tap-confirm-shake-px, 0px) * -1) 0; }
        100% { translate: 0 0; }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #182033 0%, #05070c 65%);
        touch-action: manipulation;
      }

      /* Rain rim — a soft top-edge sheen the recognition beat brightens.
         --recognition-rain-rim-alpha 0 → invisible; up to ~0.28 during beat. */
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto 0;
        height: 42vh;
        pointer-events: none;
        background: linear-gradient(180deg,
          rgba(173, 216, 255, calc(var(--recognition-rain-rim-alpha) * 1)) 0%,
          rgba(173, 216, 255, 0) 100%);
        mix-blend-mode: screen;
        z-index: 0;
        transition: none;
      }

      /* Io-recognition vignette — the snippet-authored vignetteAlpha
         darkens the screen edges when Io recognizes the returning
         player. Off-beat --io-recognition-vignette-alpha === 0 ⇒
         invisible; deep-recall pushes it to 0.18. Fades in over the
         snippet's line-reveal window so the vignette blooms in step
         with the line the selector chose. */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 55%,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.9) 100%);
        opacity: var(--io-recognition-vignette-alpha);
        z-index: 1;
        transition:
          opacity var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms);
        mix-blend-mode: multiply;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: pointer;
        touch-action: none;
      }

      .hud {
        position: fixed;
        inset: auto 0 0 0;
        padding: 18px max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        pointer-events: none;
        background:
          linear-gradient(0deg,
            rgba(255, 176, 96, calc(var(--recognition-warmth) * 0.22)) 0%,
            rgba(255, 176, 96, 0) 62%),
          linear-gradient(0deg, rgba(2, 5, 10, 0.86) 0%, rgba(2, 5, 10, 0.5) 58%, rgba(2, 5, 10, 0) 100%);
        transform: translate3d(var(--confirm-shake-x), var(--confirm-shake-y), 0);
        will-change: transform;
      }

      .failure-sting {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(circle at 50% 60%, rgba(255, 93, 128, 0.24) 0%, rgba(255, 58, 96, 0.18) 28%, rgba(0, 0, 0, 0) 72%);
        mix-blend-mode: screen;
      }

      .panel {
        position: relative;
        width: min(680px, 100%);
        border: 1px solid rgba(119, 232, 255, 0.34);
        border-radius: 18px;
        padding: 16px;
        background: rgba(5, 10, 19, 0.72);
        /* Bloom halo — additive glow modulated by the snippet's
           bloomAlpha. Off-beat → 0 (invisible). deep-recall → 0.16.
           The warm ring's alpha is PRE-RESOLVED in JS
           (main.js :: applyIoRecognitionFeelCueVars writes
           --io-recognition-bloom-ring-alpha = min(1, bloomAlpha*3.6))
           because calc() inside a color function's alpha slot is not
           reliably supported: engines that reject it invalidate the
           WHOLE box-shadow declaration, the warm ring vanishes, and
           the e2e bloom regex reds out — the recurring CI failure on
           this PR. A plain-number var in legacy rgba() parses on every
           engine. Deep-recall (0.16 → 0.576) serializes as
           `rgba(255, 214, 151, 0.576)` or the Color-4 space/slash form
           depending on the browser — the spec accepts both. */
        box-shadow:
          0 0 40px rgba(0, 204, 255, 0.12),
          inset 0 0 30px rgba(22, 89, 130, 0.14),
          0 0 calc(var(--io-recognition-bloom-alpha) * 120px)
            rgba(255, 214, 151, var(--io-recognition-bloom-ring-alpha));
        backdrop-filter: blur(12px);
        /* Compose the io-recognition camera-dolly + yaw on top of the
           haptic-scale so the recognition-beat feels like the camera
           pushes in and tilts toward the NPC on the same panel that
           already carries the haptic pop.  cameraDollyCm → translateZ
           (px in DOM space; scale 0.6 keeps deep-recall's 18cm value
           to a ~10px push — perceptible on the panel proxy but not
           motion-sickness-inducing).  cameraYawDegrees → rotateY.
           Perspective set on the .hud parent below so the transform
           reads as depth, not just a 2D shear.  Transition uses the
           snippet's reveal window so the dolly lands in time with
           the line copy. */
        transform:
          scale(var(--recognition-haptic-scale))
          translateZ(calc(var(--io-recognition-camera-dolly-cm) * 0.6px))
          rotateY(calc(var(--io-recognition-camera-yaw-deg) * 1deg));
        transform-origin: 50% 100%;
        transition:
          transform var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms),
          box-shadow var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms);
        will-change: transform, box-shadow;
      }

      /* .hud gives .panel a perspective context so translateZ + rotateY
         read as depth. transform-style: preserve-3d is required because
         .hud itself carries a translate3d(shake), which would otherwise
         flatten .panel's translateZ back onto the 2D plane. Perspective
         is modest (1600px) so the yaw stays subtle even at the
         deep-recall tier's 4.5° authored value.

         The background gradient (rgba warm-underglow) transitions over
         --io-recognition-duration-ms so the HUD's warmth wash rides the
         full recognition-beat envelope, not just the line-reveal window. */
      .hud {
        perspective: 1600px;
        perspective-origin: 50% 100%;
        transform-style: preserve-3d;
        transition: background var(--io-recognition-duration-ms)
          var(--io-recognition-easing);
      }

      .speaker {
        margin: 0 0 8px;
        color: #78e9ff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .line {
        margin: 0;
        font-size: clamp(17px, 3.6vw, 24px);
        line-height: 1.32;
        text-wrap: balance;
        /* Line-reveal — the snippet's per-tier delay + duration + easing
           choreograph how the recognition line settles in. Off-beat both
           values are 0ms so this is a no-op; at the recognition beat the
           selector-chosen tier's timing lands on the element (deep-recall
           = 180ms delay + 540ms duration; returning = 140ms + 420ms;
           first-meeting = 80ms + 260ms). letter-spacing + opacity are
           the reveal channels — small enough to be tasteful, real
           enough that CSS consumes ALL three reveal vars. */
        transition:
          opacity var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms),
          letter-spacing var(--io-recognition-line-reveal-duration-ms)
            var(--io-recognition-easing)
            var(--io-recognition-line-reveal-delay-ms);
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
        pointer-events: auto;
      }

      .move-pad {
        position: fixed;
        left: max(18px, env(safe-area-inset-left));
        bottom: max(146px, calc(env(safe-area-inset-bottom) + 146px));
        width: 116px;
        height: 116px;
        border: 1px solid rgba(173, 242, 255, 0.32);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 50%, rgba(120, 233, 255, 0.16), rgba(7, 20, 35, 0.68) 62%, rgba(2, 6, 12, 0.76));
        box-shadow: 0 0 28px rgba(0, 204, 255, 0.12), inset 0 0 22px rgba(120, 233, 255, 0.09);
        pointer-events: auto;
        touch-action: none;
        opacity: 0.88;
      }

      .move-pad[data-active="true"] {
        opacity: 1;
        border-color: rgba(255, 214, 151, 0.58);
        box-shadow: 0 0 34px rgba(255, 184, 107, 0.16), inset 0 0 24px rgba(120, 233, 255, 0.14);
      }

      .move-pad-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 42px;
        height: 42px;
        margin: -21px 0 0 -21px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(237, 247, 255, 0.92), rgba(120, 233, 255, 0.64));
        box-shadow: 0 0 18px rgba(120, 233, 255, 0.24);
        transform: translate3d(0, 0, 0);
        will-change: transform;
      }

      .route-choice {
        display: none;
        flex-basis: 100%;
        align-items: center;
        gap: 8px;
        color: rgba(237, 247, 255, 0.76);
        font-size: 12px;
        letter-spacing: 0.03em;
      }

      .route-choice[data-visible="true"] {
        display: flex;
      }

      .route-choice-label {
        margin-right: 2px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: rgba(120, 233, 255, 0.82);
      }

      button {
        border: 1px solid rgba(173, 242, 255, 0.4);
        border-radius: 999px;
        padding: 11px 14px;
        color: #edf7ff;
        background: rgba(8, 28, 43, 0.85);
        box-shadow: 0 0 20px rgba(0, 204, 255, 0.1);
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transform: translate3d(0, 0, 0) scale(1);
        transition:
          transform 84ms cubic-bezier(.2,.8,.2,1),
          box-shadow 140ms cubic-bezier(.2,.8,.2,1),
          border-color 140ms cubic-bezier(.2,.8,.2,1),
          filter 140ms cubic-bezier(.2,.8,.2,1);
        will-change: transform;
      }

      button:focus-visible {
        outline: none;
        border-color: rgba(255, 214, 151, 0.88);
        box-shadow:
          0 0 0 3px rgba(255, 214, 151, 0.18),
          0 0 24px rgba(0, 204, 255, 0.16);
      }

      button:active {
        transform: translate3d(0, 1px, 0) scale(0.975);
        filter: brightness(1.14);
        box-shadow:
          0 0 12px rgba(0, 204, 255, 0.16),
          inset 0 0 18px rgba(120, 233, 255, 0.12);
      }

      .packet-button {
        position: relative;
        overflow: hidden;
        box-shadow:
          0 0 20px rgba(0, 204, 255, 0.1),
          0 0 var(--recognition-seal-glow) rgba(255, 202, 138, 0.55);
      }

      .packet-button::after {
        content: "";
        position: absolute;
        inset: 0;
        width: calc(var(--packet-progress) * 100%);
        background: linear-gradient(90deg, rgba(120, 233, 255, 0.2), rgba(255, 184, 107, 0.28));
        pointer-events: none;
        transition: width 40ms linear;
      }

      .packet-button span {
        position: relative;
        z-index: 1;
        display: inline-block;
        transform: translate3d(0, var(--confirm-reticle-y), 0) scale(var(--confirm-reticle-scale));
        transition: transform 84ms cubic-bezier(.2,.8,.2,1);
      }

      .packet-button:active span {
        transform: translate3d(0, 1px, 0) scale(0.99);
      }

      /* Recognition impact-burst overlay (#1104). Absolute-positioned
         container anchored near the on-screen NPC-eye position; the
         render tick in main.js reconciles child `.impact-burst-particle`
         nodes to `envelope.impactBurst.particles` on every frame, so a
         14-particle radial burst spawns for ~260ms starting at frame 4
         of the eye-open animation. Empty envelope ⇒ zero children.
         Kept purely DOM (not canvas) so the visual-feel e2e can count
         primitives with `document.querySelectorAll`. */
      .impact-burst {
        position: fixed;
        left: 50%;
        top: 34vh;
        width: 0;
        height: 0;
        pointer-events: none;
        z-index: 2;
      }

      .impact-burst-particle {
        position: absolute;
        left: 0;
        top: 0;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 999px;
        background: radial-gradient(circle at 50% 50%,
          rgba(255, 236, 190, 0.95) 0%,
          rgba(255, 202, 138, 0.72) 45%,
          rgba(255, 176, 96, 0) 100%);
        box-shadow: 0 0 8px rgba(255, 214, 151, 0.7);
        mix-blend-mode: screen;
        will-change: transform, opacity;
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .impact-burst-particle { display: none; }
      }

      .state-readout {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        margin: 0;
        padding: 8px 10px;
        border-radius: 999px;
        color: rgba(237, 247, 255, 0.74);
        background: rgba(3, 7, 13, 0.58);
        font-size: 12px;
        letter-spacing: 0.04em;
        /* Kiosk-sign glow — the readout is the on-page proxy for the sign;
           --recognition-sign-glow bumps it during the recognition beat. */
        box-shadow: 0 0 var(--recognition-sign-glow) rgba(120, 233, 255, 0.55);
      }

      @media (prefers-reduced-motion: reduce) {
        button,
        .packet-button span {
          transition: none;
        }

        button:active {
          transform: none;
        }

        /* Tap-confirm envelope respects reduced-motion — the marker
           still lands (so state-driven CSS elsewhere can key off it)
           and the glow still paints (a crisp acknowledgement), but
           the scale + shake channels collapse. Same discipline as
           the .hud / .panel / .line / body::after block below. */
        button[data-aftersign-tap-confirm="armed"],
        button[data-aftersign-tap-confirm="armed"]:active {
          transform: none;
          animation: none;
          transition: box-shadow
            var(--aftersign-tap-confirm-glow-ms, 0ms)
            var(--aftersign-tap-confirm-release-easing, linear);
        }

        .packet-button:active span {
          transform: translate3d(0, var(--confirm-reticle-y), 0) scale(var(--confirm-reticle-scale));
        }

        /* io-recognition envelope respects reduced-motion — the
           snippet-authored dolly/yaw/vignette/bloom timings collapse
           to instant, so recognition still LANDS (final state is the
           snippet's numbers) but doesn't ANIMATE. Mara #1139: the new
           transitions extended the pre-existing reduced-motion gap;
           this closes it on the same four consumers the e2e checks. */
        body::after,
        .panel,
        .line,
        .hud {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="AFTERSIGN first kiosk scene"></canvas>
    <div class="failure-sting" aria-hidden="true"></div>
    <div id="movePad" class="move-pad" data-active="false" aria-label="Move Io's courier" role="application">
      <div id="movePadKnob" class="move-pad-knob" aria-hidden="true"></div>
    </div>
    <div id="recognitionImpactBurst" class="impact-burst" aria-hidden="true"></div>
    <!--
      Return-tone feel surface. Stamped by main.js ::
      window.__game.applyReturnToneFeel(reason) — writes the 11 CSS
      variables + dataset marker authored by
      apps/web/src/aftersign/returnToneChoiceFeel.ts onto this element
      so the eventual "why did you come back?" beat can drive its press
      envelope from ONE tuned table (kind/evasive/blunt).
      `hidden` here keeps the node out of the layout tree until the beat
      wires visible chrome to the same [data-aftersign-return-surface]
      selector; the CSS variables land on the node regardless of the
      hidden attribute (they're consulted by any descendant styling
      that opts into them later).
    -->
    <div id="aftersignReturnSurface" data-aftersign-return-surface hidden aria-hidden="true"></div>
    <p class="state-readout" id="stateReadout">story: packet-offered · memory: pending</p>
    <section class="hud" aria-live="polite">
      <div class="panel">
        <p class="speaker" id="speaker">Io</p>
        <p class="line" id="line">Keep it sealed if you want the city to trust you. I will remember which version of you touches that blue kiosk.</p>
        <div class="controls">
          <!--
            data-aftersign-tap-choice: names the buttons that COMMIT a
            fork so the harness's `getTapChoiceFeelReport()` can measure
            each rendered rect against the 44px minimum tap target on
            the live DOM (see apps/web/src/aftersign/tapChoiceFeel.ts
            + servedSurface.contract.test.ts). The four buttons below
            are the choice-commit surfaces — packet gesture, the two
            route-memory forks, and the delivery commit; sound/reset
            are utility controls, not forks, and stay unlabeled.
          -->
          <button id="packetButton" class="packet-button" type="button" data-aftersign-tap-choice="packet" aria-label="Tap the packet to preserve the seal, or hold to open it"><span>Tap packet / hold to open</span></button>
          <div id="offeredJobs" aria-label="Offered jobs"></div>
          <div id="routeChoice" class="route-choice" data-visible="false" aria-label="Choose whether you listened to Io's route before delivery">
            <span class="route-choice-label">Route memory</span>
            <button id="acknowledgeRouteButton" type="button" data-aftersign-tap-choice="acknowledge-kiosk">I listened</button>
            <button id="skipRouteButton" type="button" data-aftersign-tap-choice="skip-kiosk-acknowledge">I ran early</button>
          </div>
          <!-- M-LOOP-E1 route/risk choice (#1372). Two tappable route
               options ("fast" vs "safe") stamped every run at the
               packet-choice beat by `renderRouteRiskChoice` (see
               apps/web/src/aftersign/routeRiskMemory.ts). The pick
               writes `state.player.routeRisk`, which the persist
               payload clones — so the fact round-trips across reload
               and feeds `computeOfferedActions` on the next run. -->
          <div id="routeRiskChoice" class="route-choice" data-visible="false" data-aftersign-route-risk-surface aria-label="Choose a fast or safe route for this delivery run">
            <span class="route-choice-label">Route risk</span>
          </div>
          <button id="deliverButton" type="button" data-aftersign-tap-choice="deliver-packet">Deliver at the blue kiosk</button>
          <button id="soundButton" type="button">Wake kiosk sound</button>
          <button id="resetButton" type="button">Reset slice save</button>
        </div>
      </div>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
