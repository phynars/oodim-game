<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AFTERSIGN — Kiosk Slice</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05070c;
        color: #edf7ff;
        --confirm-shake-x: 0px;
        --confirm-shake-y: 0px;
        --packet-progress: 0;
        --recognition-sign-glow: 0px;
        --recognition-seal-glow: 0px;
        --recognition-rain-rim-alpha: 0;
        --recognition-haptic-scale: 1;
        --recognition-warmth: 0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #182033 0%, #05070c 65%);
        touch-action: manipulation;
      }

      /* Rain rim — a soft top-edge sheen the recognition beat brightens.
         --recognition-rain-rim-alpha 0 → invisible; up to ~0.28 during beat. */
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto 0;
        height: 42vh;
        pointer-events: none;
        background: linear-gradient(180deg,
          rgba(173, 216, 255, calc(var(--recognition-rain-rim-alpha) * 1)) 0%,
          rgba(173, 216, 255, 0) 100%);
        mix-blend-mode: screen;
        z-index: 0;
        transition: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: pointer;
        touch-action: none;
      }

      .hud {
        position: fixed;
        inset: auto 0 0 0;
        padding: 18px max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        pointer-events: none;
        background:
          linear-gradient(0deg,
            rgba(255, 176, 96, calc(var(--recognition-warmth) * 0.22)) 0%,
            rgba(255, 176, 96, 0) 62%),
          linear-gradient(0deg, rgba(2, 5, 10, 0.86) 0%, rgba(2, 5, 10, 0.5) 58%, rgba(2, 5, 10, 0) 100%);
        transform: translate3d(var(--confirm-shake-x), var(--confirm-shake-y), 0);
        will-change: transform;
      }

      .failure-sting {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(circle at 50% 60%, rgba(255, 93, 128, 0.24) 0%, rgba(255, 58, 96, 0.18) 28%, rgba(0, 0, 0, 0) 72%);
        mix-blend-mode: screen;
      }

      .panel {
        width: min(680px, 100%);
        border: 1px solid rgba(119, 232, 255, 0.34);
        border-radius: 18px;
        padding: 16px;
        background: rgba(5, 10, 19, 0.72);
        box-shadow: 0 0 40px rgba(0, 204, 255, 0.12), inset 0 0 30px rgba(22, 89, 130, 0.14);
        backdrop-filter: blur(12px);
        transform: scale(var(--recognition-haptic-scale));
        transform-origin: 50% 100%;
        will-change: transform;
      }

      .speaker {
        margin: 0 0 8px;
        color: #78e9ff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .line {
        margin: 0;
        font-size: clamp(17px, 3.6vw, 24px);
        line-height: 1.32;
        text-wrap: balance;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
        pointer-events: auto;
      }

      .route-choice {
        display: none;
        flex-basis: 100%;
        align-items: center;
        gap: 8px;
        color: rgba(237, 247, 255, 0.76);
        font-size: 12px;
        letter-spacing: 0.03em;
      }

      .route-choice[data-visible="true"] {
        display: flex;
      }

      .route-choice-label {
        margin-right: 2px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: rgba(120, 233, 255, 0.82);
      }

      button {
        border: 1px solid rgba(173, 242, 255, 0.4);
        border-radius: 999px;
        padding: 11px 14px;
        color: #edf7ff;
        background: rgba(8, 28, 43, 0.85);
        box-shadow: 0 0 20px rgba(0, 204, 255, 0.1);
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:active {
        transform: translateY(1px) scale(0.99);
      }

      .packet-button {
        position: relative;
        overflow: hidden;
        box-shadow:
          0 0 20px rgba(0, 204, 255, 0.1),
          0 0 var(--recognition-seal-glow) rgba(255, 202, 138, 0.55);
      }

      .packet-button::after {
        content: "";
        position: absolute;
        inset: 0;
        width: calc(var(--packet-progress) * 100%);
        background: linear-gradient(90deg, rgba(120, 233, 255, 0.2), rgba(255, 184, 107, 0.28));
        pointer-events: none;
        transition: width 40ms linear;
      }

      .packet-button span {
        position: relative;
        z-index: 1;
      }

      .state-readout {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        margin: 0;
        padding: 8px 10px;
        border-radius: 999px;
        color: rgba(237, 247, 255, 0.74);
        background: rgba(3, 7, 13, 0.58);
        font-size: 12px;
        letter-spacing: 0.04em;
        /* Kiosk-sign glow — the readout is the on-page proxy for the sign;
           --recognition-sign-glow bumps it during the recognition beat. */
        box-shadow: 0 0 var(--recognition-sign-glow) rgba(120, 233, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="AFTERSIGN first kiosk scene"></canvas>
    <div class="failure-sting" aria-hidden="true"></div>
    <p class="state-readout" id="stateReadout">story: packet-offered</p>
    <section class="hud" aria-live="polite">
      <div class="panel">
        <p class="speaker" id="speaker">Io</p>
        <p class="line" id="line">Keep it sealed if you want the city to trust you. Touch the blue kiosk when you're ready.</p>
        <div class="controls">
          <button id="packetButton" class="packet-button" type="button" aria-label="Tap the packet to preserve the seal, or hold to open it"><span>Tap packet / hold to open</span></button>
          <div id="routeChoice" class="route-choice" data-visible="false" aria-label="Choose whether you listened to Io's route before delivery">
            <span class="route-choice-label">Route memory</span>
            <button id="acknowledgeRouteButton" type="button">I listened</button>
            <button id="skipRouteButton" type="button">I ran early</button>
          </div>
          <button id="deliverButton" type="button">Deliver at the blue kiosk</button>
          <button id="soundButton" type="button">Wake kiosk sound</button>
          <button id="resetButton" type="button">Reset slice save</button>
        </div>
      </div>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
