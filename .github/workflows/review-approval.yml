name: review-approval

# Review-approval gate (#2571). Protected changes (.github/workflows/**, gate
# scripts) need a non-author APPROVED review.
#
# This intentionally triggers ONLY on review events, not on pull_request.
# A failing job on pull_request deadlocks: APPROVE is refused while CI is red,
# and CI could only go green after an APPROVE (PR #2572 review, F1). On review
# events the check runs after the decision is recorded. It is green on a
# non-author approval and red on changes-requested or a dismissal. Before any
# review it is absent, so branch protection sees it as pending, not failed.
# CI completion also re-evaluates the current head, replacing a review check
# that was cancelled or left in progress after an earlier review event.
on:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # Per-event group: a CI completion must not cancel an in-flight review run.
  group: review-approval-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-approval:
    # workflow_run is also raised for branch pushes; only recheck PR-associated CI.
    if: github.event_name == 'pull_request_review' || github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: protected changes require a non-author approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEW_GATE_MODE: ${{ github.event_name == 'workflow_run' && 'status' || 'exit' }}
        run: node scripts/review-approval-gate.mjs
