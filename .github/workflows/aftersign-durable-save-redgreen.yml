# AFTERSIGN durable save/load harness — red/green polarity gate.
#
# The default aftersign lane keeps the durable save/load contract skipped until
# a real durable path exists, because a permanently red main e2e suite hides
# unrelated regressions. This workflow gives the contract its failing-first
# proof anyway: FLAGSHIP_BREAK_MODE=local-only-save unskips the same spec and
# the red job inverts the exit code.
#
# Mirrors .github/workflows/agar-persistence-redgreen.yml — the shape the
# reviewer confirmed on #526 (same polarity, same preflight-then-invert).

name: aftersign-durable-save-redgreen

permissions:
  contents: read

on:
  # `package.json` / `package-lock.json` intentionally NOT in the paths
  # filter (mirrors #830 for the sibling npc-memory lane): this lane's
  # real signal comes from `aftersign/**`. Lockfile drift is already
  # surfaced by the main `aftersign` CI lane which shares the `npm
  # install` guarantee via `actions/setup-node`'s cache — including
  # package.json here just dragged every scripts-only or devDep-only PR
  # onto a Playwright spec that doesn't exist yet
  # (`e2e/save-load-durable-contract.spec.ts` — the preflight below
  # keeps the guard-string check for when it lands).
  pull_request:
    paths:
      - "aftersign/**"
      - ".github/workflows/aftersign-durable-save-redgreen.yml"
  push:
    branches: [main]
    paths:
      - "aftersign/**"
      - ".github/workflows/aftersign-durable-save-redgreen.yml"

jobs:
  green-polarity:
    name: durable-save contract (green — default suite remains skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # npm install (not `npm ci`) — matches deploy.yml precedent
        # (2026-06-20): agents can't regenerate package-lock.json in
        # this environment, so any PR that adds a devDep would strand
        # this lane on strict-sync until a human ran npm locally.
        # See #836 for the vitest devDep that first exposed this.
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Preflight: `test:e2e:aftersign:durable-save` runs Playwright over
      # BOTH `e2e/save-load-durable-contract.spec.ts` (the shared-contract
      # spec) and `e2e/durable-save-load.spec.ts` (the hard-nav sibling).
      # The shared-contract spec has not landed yet (see the top-of-file
      # comment in durable-save-load.spec.ts and #727). If it's missing,
      # Playwright errors before running the sibling — turning this lane
      # red on every unrelated aftersign PR. Retire the green-polarity
      # step until the shared-contract spec lands; the red-polarity job
      # below still runs its own preflight against the same file.
      - name: Preflight — confirm the shared-contract spec exists
        id: preflight
        shell: bash
        run: |
          spec=aftersign/e2e/save-load-durable-contract.spec.ts
          if [ -f "$spec" ]; then
            echo "shared-contract spec present — green polarity will run."
            echo "retired=false" >> "$GITHUB_OUTPUT"
          else
            echo "shared-contract spec ($spec) not yet landed — green polarity retired until it exists."
            echo "retired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AFTERSIGN durable save/load spec in default mode
        if: steps.preflight.outputs.retired == 'false'
        run: npm run test:e2e:aftersign:durable-save

  red-polarity-local-only:
    name: durable-save contract (red — local-only-save MUST fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # npm install — see green-polarity job above for rationale.
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Preflight — confirm the guard string still exists
        id: preflight
        shell: bash
        run: |
          # Whitespace-tolerant search: matches the guard regardless of how
          # the `test.skip(...)` call is line-wrapped or reformatted. If the
          # guard is genuinely gone (durability landed → spec is unconditional)
          # we surface that as `retired=true` and skip the red job. If the
          # guard has merely been RENAMED or the sentinel value drifted, that
          # is a silent-disable footgun — fail loud so a human decides.
          spec=aftersign/e2e/save-load-durable-contract.spec.ts
          if grep -Pzo '(?s)process\.env\.FLAGSHIP_BREAK_MODE\s*!==\s*"local-only-save"' "$spec" > /dev/null; then
            echo "guard present — red polarity will run."
            echo "retired=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'test\.skip(' "$spec"; then
            echo "::error::Spec still calls test.skip(...) but the FLAGSHIP_BREAK_MODE=local-only-save guard is missing or altered. The red-polarity lane cannot verify itself — update this workflow's preflight if the sentinel intentionally changed."
            exit 1
          else
            echo "durable save/load contract is fully live in the main suite — red polarity retired."
            echo "retired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AFTERSIGN durable save/load contract (red polarity — MUST fail)
        if: steps.preflight.outputs.retired == 'false'
        shell: bash
        run: |
          set +e
          npm run test:e2e:aftersign:durable-save:broken-local-only
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Broken-polarity spec passed (exit 0) — durable save/load did NOT catch the local-only-save break mode."
            exit 1
          else
            echo "Broken-polarity spec failed as expected (exit $rc) — durable save/load guard is honest."
            exit 0
          fi
