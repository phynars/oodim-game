# Generated by aidlc workflows-gen (schema 1) from the repo profile's ci.workflows. Re-render; a hand edit fails the workflows-drift job.
# sha256: 76ddfede124a36da84ce72c6617a57f70dd11240387c5ddc9f1bf7328c6969be
name: "Deploy game.oodim.com"
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - run: "npm run build"
      - run: "bash scripts/ci/stage-site.sh"
      - name: "Deploy to Cloudflare"
        id: cf
        if: "${{ env.CF_TOKEN != '' }}"
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          wranglerVersion: "4.120.0"
      - name: "Note if deploy skipped"
        if: "${{ env.CF_TOKEN == '' }}"
        run: "echo \"::warning::CLOUDFLARE_API_TOKEN secret not set: built but did not publish.\""
      - if: "${{ steps.cf.outcome == 'success' }}"
        run: "bash scripts/ci/post-deploy.sh smoke"
        env:
          DEPLOY_ENV: production
          BASE_URL: "https://game.oodim.com"
          EVENT_NAME: "${{ github.event_name }}"
          PUSH_BEFORE: "${{ github.event.before }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GH_TOKEN: "${{ github.token }}"
      - if: "${{ steps.cf.outcome == 'success' }}"
        run: "bash scripts/ci/post-deploy.sh m-loop"
        env:
          DEPLOY_ENV: production
          BASE_URL: "https://game.oodim.com"
          EVENT_NAME: "${{ github.event_name }}"
          PUSH_BEFORE: "${{ github.event.before }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GH_TOKEN: "${{ github.token }}"
      - if: "${{ steps.cf.outcome == 'success' }}"
        run: "bash scripts/ci/post-deploy.sh served-replay"
        env:
          DEPLOY_ENV: production
          BASE_URL: "https://game.oodim.com"
          EVENT_NAME: "${{ github.event_name }}"
          PUSH_BEFORE: "${{ github.event.before }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GH_TOKEN: "${{ github.token }}"
      - if: "${{ always() && steps.cf.outcome == 'success' }}"
        uses: actions/upload-artifact@v7
        with:
          name: deploy
          path: |
            aftersign/playwright-report/
            aftersign/test-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
  deploy-alarm:
    needs:
      - deploy
    if: "${{ !cancelled() && true }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: "file, bump or close the RED issue"
        env:
          GH_TOKEN: "${{ github.token }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA: "${{ github.sha }}"
          NEEDS: "${{ toJSON(needs) }}"
          WHAT: "The production deploy"
          TITLE: "bug: game.oodim.com deploy RED"
          LABELS: "agent-filed,type:bug,priority:P1"
          BODY: |-
            Do this first: open the run, find the FAILED step in the deploy job, and paste its last ~40 log lines into your PR description before proposing a fix. Do NOT guess from this template.
            The deploy's wrangler comes from the wranglerVersion pin in the oodim repo profile (rendered into deploy.yml and deploy-staging.yml), not from this repo's wrangler devDependency.
        run: |-
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"$NEEDS" | tr -d '\r' | paste -sd, -)
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -z "$failed" ]; then
            if [ -n "$n" ]; then gh issue close "$n" --comment "$WHAT is green again at ${SHA:0:8}: $RUN_URL"; fi
            exit 0
          fi
          msg=$(printf '%s failed at `%s`.\n\nFailed jobs: %s\nRun: %s' "$WHAT" "${SHA:0:8}" "$failed" "$RUN_URL")
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"; exit 0; fi
          args=()
          IFS=, read -ra labels <<<"$LABELS"
          for l in "${labels[@]}"; do [ -n "$l" ] && args+=(--label "$l"); done
          gh issue create --title "$TITLE" "${args[@]}" --body "$(printf '%s\n\n%s' "$msg" "$BODY")"
