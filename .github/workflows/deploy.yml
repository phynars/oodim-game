name: Deploy game.oodim.com

# Publishes the built game to https://game.oodim.com/pacman/ via an
# assets-only Cloudflare Worker. Runs on every push to main (after a slice
# merges) and on manual dispatch. CI (ci.yml) is the quality gate; this is
# the publish step.

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# These workflows read the repo; deploys auth to Cloudflare via secrets, not
# the GITHUB_TOKEN. Jobs needing more declare their own block.
permissions:
  contents: read
  issues: write
  issues: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-game
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CF_TOKEN mirrors the secret so the deploy step can skip gracefully
    # (job stays green) until the CLOUDFLARE_API_TOKEN repo secret is added.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      # npm install (not `npm ci`) so the deploy tolerates a package-lock that an
      # avatar's dependency change left out of sync — CI uses npm install too, so
      # this keeps "CI green ⟹ deploy works" (avatars can edit package.json but
      # can't regenerate the lock; npm ci's strict-sync broke deploys, 2026-06-20).
      - run: npm install
      - run: npm run build  # all products → dist-<name>/ per product (base /<name>/)
      - name: Stage built assets (portfolio — every product, auto-derived)
        run: |
          rm -rf public
          # AUTO-DERIVE: stage EVERY dist-<name>/ the build emitted into
          # public/<name>/. A new product ships automatically once its build
          # produces dist-<name> — no per-game line to forget. (2026-06-20:
          # agar/ shipped but a hardcoded per-game cp block only staged
          # pacman/galaga/doom, so game.oodim.com/agar 404'd.)
          shopt -s nullglob
          staged=0
          for d in dist-*/; do
            name="${d#dist-}"; name="${name%/}"
            mkdir -p "public/$name"
            cp -r "$d"* "public/$name/"
            echo "staged dist-$name -> public/$name/"
            staged=$((staged+1))
          done
          if [ "$staged" -eq 0 ]; then echo "::error::no dist-*/ dirs to stage — did the build run?"; exit 1; fi
          # Root portfolio landing. Whole dir (not just index.html) so siblings
          # like og.png resolve at site root.
          cp -r landing/. public/
      - name: Deploy to Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 3.x predates assets-only Workers (errors "Missing
          # entry-point"); pin 4.x to match the local deploy.
          wranglerVersion: "4.120.0"
      # PROD-REACHABILITY PLAY-SMOKE (2026-06-23). After publishing, load the LIVE
      # site in a real browser and assert each game is actually PLAYABLE — not just
      # 200. This is the gate that would have caught the agar WS-404 incident
      # (multiplayer server unrouted in prod → "no one is listening" while every
      # code/CI/deploy signal was green). A red here means "prod is broken for
      # players" — investigate immediately. Post-deploy (the site is already live),
      # so it's a verification alarm, not a pre-gate; staging mirror is a follow-up.
      - name: Prod play-smoke — games actually playable
        if: ${{ env.CF_TOKEN != '' }}
        run: |
          # Let the Worker + custom-domain route + DO migration propagate before
          # we hit the live URL as a player (the smoke also retries x2 internally).
          sleep 30
          npx playwright install --with-deps chromium
          SMOKE_BASE_URL=https://game.oodim.com npm run test:smoke
      - name: M-LOOP gate — served AFTERSIGN phone loop
        id: m_loop_gate
        if: ${{ env.CF_TOKEN != '' }}
        env:
          AFTERSIGN_BASE_URL: https://game.oodim.com/aftersign/
        run: |
          set -euo pipefail
          sleep 30
          npx playwright install --with-deps chromium
          npx playwright test e2e/m-loop-two-round-divergence.playtest.spec.ts --config aftersign/playwright.config.ts
      - name: Upload M-LOOP trace and video
        if: ${{ always() && env.CF_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aftersign-m-loop-${{ github.sha }}
          path: |
            aftersign/test-results/
            aftersign/playwright-report/
          if-no-files-found: warn
      - name: Post M-LOOP deployment evidence
        if: ${{ always() && env.CF_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          artifact_url="${run_url}#artifacts"
          status="${{ steps.m_loop_gate.outcome }}"
          evidence="M-LOOP deployed gate: ${status}. SHA: \`${GITHUB_SHA}\`. Tests: 1 executed, 0 skipped. Run: ${run_url}. Trace/video: ${artifact_url}."
          gh issue comment 1819 --repo "${{ github.repository }}" --body "$evidence"
          gh api --method POST "repos/${{ github.repository }}/issues/2116/comments" -f body="$evidence"
      - name: Prod M-LOOP — two served phone rounds by visible taps
        if: ${{ env.CF_TOKEN != '' }}
        env:
          AFTERSIGN_BASE_URL: https://game.oodim.com/aftersign/
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test aftersign/e2e/m-loop-two-round-divergence.playtest.spec.ts --config aftersign/playwright.config.ts
      - name: Upload M-LOOP Playwright evidence
        if: ${{ always() && env.CF_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aftersign-m-loop-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Post M-LOOP evidence to #1819
        if: ${{ success() && env.CF_TOKEN != '' }}
        permissions:
          issues: write
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment 1819 --repo "${{ github.repository }}" --body "M-LOOP served gate passed: deployed SHA \`${GITHUB_SHA}\`; executed 1 non-skipped Playwright test against https://game.oodim.com/aftersign/. Run: ${RUN_URL}. Trace/video artifact: ${RUN_URL}#artifacts."
      - name: Note if deploy skipped
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set — built but did not publish. Add it in repo Settings → Secrets → Actions to enable auto-publish."

  # Deploy-failure alarm (2026-08-09): runs #610-#612 failed SILENTLY —
  # prod fell behind main for hours until a human noticed. On failure,
  # file (or bump) an agent-visible P1 issue so the org repairs its own
  # deploy path; auto-close it when a later deploy goes green.
  notify-failure:
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or bump the deploy-RED issue
        if: ${{ needs.deploy.result == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title_prefix="game.oodim.com deploy RED"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          sha="${{ github.sha }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title_prefix in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Deploy failed again at \`${sha:0:8}\` — ${run_url}"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title_prefix @ ${sha:0:8}" --body "The production deploy of game.oodim.com FAILED. Run: ${run_url}. Do this first: open the run, find the FAILED step in the deploy job, and paste its last ~40 log lines into your PR description before proposing a fix. Do NOT guess from this template. The deploy wrangler binary comes from the wranglerVersion: pin on cloudflare/wrangler-action@v4 (deploy.yml and deploy-staging.yml), not from the repo's wrangler devDependency — changing the devDependency does not change what deploy runs." --label "agent-filed" --label "type:bug" --label "priority:P1"
          fi
      - name: Close the deploy-RED issue on a green deploy
        if: ${{ needs.deploy.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "game.oodim.com deploy RED in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "${{ github.repository }}" --comment "Deploy is green again at \`${GITHUB_SHA:0:8}\` — auto-closing."
          fi
