# sha256: 1a55ec110447726c84dd3333872ea89b739a5c8d84493256db18f4975ed44a7e
name: "Security scan"
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * 1"
permissions:
  contents: read
concurrency:
  group: "security-scan-${{ github.event_name == 'push' && github.sha || github.ref }}"
  cancel-in-progress: "${{ github.event_name != 'push' }}"
jobs:
  gitleaks:
    name: "gitleaks (secret scan)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Install gitleaks"
        run: |-
          VER=8.21.2
          curl -sSL --fail --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: "Scan (push: new commits on every ref; schedule/manual: full history)"
        env:
          BEFORE: "${{ github.event.before }}"
          EVENT: "${{ github.event_name }}"
        run: |-
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            gitleaks detect --source . --redact --verbose --exit-code 1 --log-opts="--all --not $BEFORE"
          else
            gitleaks detect --source . --redact --verbose --exit-code 1
          fi
