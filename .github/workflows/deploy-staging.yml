name: "Deploy staging.game.oodim.com"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or ref to deploy to staging"
        required: false
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ inputs.branch }}"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - run: "npm run build"
      - run: "bash scripts/ci/stage-site.sh"
      - name: "Deploy to Cloudflare (staging)"
        id: cf
        if: "${{ env.CF_TOKEN != '' }}"
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          wranglerVersion: "4.120.0"
          command: "deploy --config wrangler.staging.jsonc"
      - name: "Note if deploy skipped"
        if: "${{ env.CF_TOKEN == '' }}"
        run: "echo \"::warning::CLOUDFLARE_API_TOKEN secret not set: built but did not publish.\""
      - if: "${{ steps.cf.outcome == 'success' }}"
        run: "bash scripts/ci/post-deploy.sh smoke"
        env:
          DEPLOY_ENV: staging
          BASE_URL: "https://staging.game.oodim.com"
          EVENT_NAME: "${{ github.event_name }}"
          PUSH_BEFORE: "${{ github.event.before }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GH_TOKEN: "${{ github.token }}"
      - if: "${{ steps.cf.outcome == 'success' }}"
        run: "bash scripts/ci/post-deploy.sh m-loop"
        env:
          DEPLOY_ENV: staging
          BASE_URL: "https://staging.game.oodim.com"
          EVENT_NAME: "${{ github.event_name }}"
          PUSH_BEFORE: "${{ github.event.before }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GH_TOKEN: "${{ github.token }}"
      - if: "${{ steps.cf.outcome == 'success' }}"
        run: "bash scripts/ci/post-deploy.sh served-replay"
        env:
          DEPLOY_ENV: staging
          BASE_URL: "https://staging.game.oodim.com"
          EVENT_NAME: "${{ github.event_name }}"
          PUSH_BEFORE: "${{ github.event.before }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GH_TOKEN: "${{ github.token }}"
      - if: "${{ always() && steps.cf.outcome == 'success' }}"
        uses: actions/upload-artifact@v7
        with:
          name: deploy
          path: |
            aftersign/playwright-report/
            aftersign/test-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
