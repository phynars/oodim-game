      - run: "bash scripts/ci/harness-self-test.sh"
  review-approval-status:
    if: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ github.event.repository.default_branch }}"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: "node scripts/review-approval-gate.mjs"
        env:
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
          GH_TOKEN: "${{ github.token }}"
          GITHUB_TOKEN: "${{ github.token }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          REVIEW_GATE_MODE: status
  main-alarm:
    needs:
      - changes
      - workflows-drift
      - wiring
      - served-reach
      - fail-to-pass
      - served-worker
      - pacman
      - galaga
      - doom
      - agar
      - aftersign-checks
      - aftersign
      - aftersign-result
      - landing
      - harness
      - review-approval-status
    if: "${{ !cancelled() && github.event_name == 'schedule' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: "file, bump or close the RED issue"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA: "${{ github.sha }}"
          NEEDS: "${{ toJSON(needs) }}"
          WHAT: "Scheduled CI on main"
          TITLE: "bug: main is RED (scheduled CI)"
          LABELS: "agent-filed,type:bug,priority:P1"
          BODY: |-
            Main is the shared base: every open PR inherits this red until it is fixed.
            Milestone: M2 — a returning player is recognized on the served page
            Epic: M2-EINT — wire the July contracts into the served surface
        run: |-
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"$NEEDS" | tr -d '\r' | paste -sd, -)
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -z "$failed" ]; then
            if [ -n "$n" ]; then gh issue close "$n" --comment "$WHAT is green again at ${SHA:0:8}: $RUN_URL"; fi
            exit 0
          fi
          msg=$(printf '%s failed at `%s`.\n\nFailed jobs: %s\nRun: %s' "$WHAT" "${SHA:0:8}" "$failed" "$RUN_URL")
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"; exit 0; fi
          args=()
          IFS=, read -ra labels <<<"$LABELS"
          for l in "${labels[@]}"; do [ -n "$l" ] && args+=(--label "$l"); done
          gh issue create --title "$TITLE" "${args[@]}" --body "$(printf '%s\n\n%s' "$msg" "$BODY")"
