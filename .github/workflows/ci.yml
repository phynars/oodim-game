    if: "${{ !cancelled() && needs.aftersign.result != 'skipped' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - uses: actions/download-artifact@v8
        with:
          pattern: "aftersign-shard-*"
          path: shards
      - run: "bash scripts/ci/aftersign-e2e.sh report"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GH_TOKEN: "${{ github.token }}"
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
          EVENT_NAME: "${{ github.event_name }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          SERVED_RESULT: "${{ needs.served-reach.outputs.result }}"
          SERVED_COUNTS: "${{ needs.served-reach.outputs.counts }}"
          SERVED_EXEMPT: "${{ needs.served-reach.outputs.exempt }}"
          SHARDS_RESULT: "${{ needs.aftersign.result }}"
      - name: "every shard passed"
        env:
          SHARDS_RESULT: "${{ needs.aftersign.result }}"
        run: "test \"$SHARDS_RESULT\" = success"
