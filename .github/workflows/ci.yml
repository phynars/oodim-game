name: CI
# Per-product CI lanes (2026-06-19). Previously ONE aggregate job ran
# `typecheck && build && test:e2e` across pacman + galaga + doom, so ANY
# product's broken test failed EVERY PR — a galaga regression jammed doom
# slices and a doom WebGL flake jammed galaga (the recurring cross-product
# CI jam). Now a `changes` job detects which product(s) a PR touches, and
# only those lanes run: a doom-only PR is gated solely by doom's
# typecheck/build/gameplay-harness; a shared/root change runs all three.
# The auto-merge gate reads the workflow RUN conclusion (skipped lanes don't
# fail it), so no branch-protection change is needed.
# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# These workflows read the repo; deploys auth to Cloudflare via secrets, not
# the GITHUB_TOKEN. Jobs needing more declare their own block.
permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_frozen_games:
        description: "Run archival frozen-game lanes (pacman/galaga/doom/agar)"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      pacman: ${{ steps.filter.outputs.pacman }}
      galaga: ${{ steps.filter.outputs.galaga }}
      doom: ${{ steps.filter.outputs.doom }}
      agar: ${{ steps.filter.outputs.agar }}
      aftersign: ${{ steps.filter.outputs.aftersign }}
      landing: ${{ steps.filter.outputs.landing }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            pacman:
              - 'pacman/**'
            galaga:
              - 'galaga/**'
            doom:
              - 'doom/**'
            agar:
              - 'agar/**'
            aftersign:
              - 'aftersign/**'
              - 'apps/web/src/aftersign/**'
              - 'e2e-shared/aftersign/**'
            landing:
              - 'landing/**'
            shared:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'

  # Product-wiring guard — always runs (no filter). Fails the PR if any product
  # dir (<name>/vite.config.ts) isn't fully wired into package.json + ci.yml, so
  # a new game can't ship half-registered (the agar/ deploy-404 + no-CI-lane
  # class, 2026-06-20). See scripts/check-product-wiring.mjs.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/check-product-wiring.mjs

  pacman:
    needs: changes
    if: ${{ needs.changes.outputs.pacman == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_frozen_games == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck:pacman
      - run: npm run build:pacman
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pacman
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pacman-playwright-trace
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  galaga:
    needs: changes
    if: ${{ needs.changes.outputs.galaga == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_frozen_games == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck:galaga
      - run: npm run build:galaga
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:galaga
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: galaga-playwright-trace
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  doom:
    needs: changes
    if: ${{ needs.changes.outputs.doom == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_frozen_games == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck:doom
      - run: npm run build:doom
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:doom
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: doom-playwright-trace
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  agar:
    needs: changes
    if: ${{ needs.changes.outputs.agar == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_frozen_games == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck:agar
      - run: npm run build:agar
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:agar
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agar-playwright-trace
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  aftersign:
    needs: changes
    if: ${{ needs.changes.outputs.aftersign == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck:aftersign
      # Burn-down surface for #843 / #846: strict `tsc --noEmit` over the
      # `apps/web/src/aftersign/` tree via the sibling tsconfig
      # `aftersign/tsconfig.apps-web.json`. Non-blocking on purpose —
      # the main `typecheck:aftersign` step above keeps `include: ["src"]`
      # (see the comment inside `aftersign/tsconfig.json` and PR #837's
      # blast-radius failure), and this step surfaces the ~25 files'
      # latent errors in the log without gating merges on them. Fix
      # errors file-by-file; flip to blocking by removing
      # `continue-on-error: true` on this step once it lands green on
      # its own, then retire the sibling per its own header comment.
      - run: npm run typecheck:aftersign:apps-web
        continue-on-error: true
      - run: npm run test:unit:aftersign
      - run: npm run build:aftersign
      # Pure lane runs BEFORE the browser install and the main lane: it
      # launches no browser (see aftersign/playwright.pure.config.ts) and
      # is deterministic (retries: 0), so it costs ~seconds and gives a
      # first-attempt green signal on the pure-controller contracts before
      # the main lane pays the vite-preview + SwiftShader boot tax. Issue
      # #829 explicitly allows "before or alongside" — running first means
      # the pure step actually executes even when the main lane's
      # pre-existing SwiftShader flake (#700/#506) aborts the job.
      - name: Test aftersign pure-logic (Node)
        run: npm run test:aftersign:pure
      - run: npx playwright install --with-deps chromium
      - name: Test aftersign WebGL e2e (Playwright)
        id: e2e
        shell: bash
        # Tee the runner output so the failure-summary step can quote the
        # RAW log tail when playwright-report/results.json is missing — a
        # pre-spec crash (webServer boot failure) writes no JSON report,
        # and without the raw log the summary was useless (#1065).
        run: |
          set -o pipefail
          npm run test:e2e:aftersign 2>&1 | tee /tmp/aftersign-e2e-runner.log
      - name: Print aftersign failure summary
        if: failure() && steps.e2e.conclusion == 'failure'
        run: |
          # Build the failure summary ONCE into a tempfile, then (a) tee it
          # to $GITHUB_STEP_SUMMARY for humans on the run page and (b) export
          # it to $GITHUB_ENV as AFTERSIGN_FIRST_CONTEXT so the next step can
          # relay it to a PR comment. Keeping both readers off the same
          # source avoids the "step summary and PR comment disagree" drift.
          #
          # SINGLE INPUT: playwright-report/results.json, produced by the
          # `json` reporter configured in aftersign/playwright.config.ts.
          # Prior iterations of this step also tried to read
          # `test-results/**/error-context.md` and grep for
          # `[aftersign globalSetup]` lines under those dirs — NEITHER file
          # is actually written by Playwright or by the aftersign harness
          # (error-context.md isn't a real Playwright artifact; globalSetup
          # logs to console → step log, not to files). Those branches only
          # ever printed "(none)" placeholders, drowning the real error
          # signal. See PR #1037 review by Mara Okonkwo.
          summary_file="$(mktemp)"

          {
            echo "## aftersign WebGL e2e — failure summary"
            echo ""

            if [ -f playwright-report/results.json ]; then
              echo "### first failing spec (from playwright-report/results.json)"
              echo '```'
              node -e '
                const fs = require("node:fs");
                const report = JSON.parse(fs.readFileSync("playwright-report/results.json", "utf8"));

                function findFirstFailingSpec(node) {
                  if (!node || typeof node !== "object") return null;

                  if (Array.isArray(node.specs)) {
                    for (const spec of node.specs) {
                      const title = spec.title || spec.file || "(unknown spec)";
                      if (Array.isArray(spec.tests)) {
                        for (const test of spec.tests) {
                          if (!Array.isArray(test.results)) continue;
                          for (const result of test.results) {
                            if (!Array.isArray(result.errors)) continue;
                            for (const err of result.errors) {
                              if ((err && err.message) || err) {
                                const message = String((err && err.message) || err || "");
                                return { title, message };
                              }
                            }
                          }
                        }
                      }
                    }
                  }

                  if (Array.isArray(node.suites)) {
                    for (const suite of node.suites) {
                      const found = findFirstFailingSpec(suite);
                      if (found) return found;
                    }
                  }

                  return null;
                }

                const first = findFirstFailingSpec(report);
                if (first) {
                  console.log(`spec: ${first.title}`);
                  console.log("error:");
                  console.log(first.message.split("\\n").slice(0, 20).join("\\n"));
                } else {
                  console.log("(no failing test recorded in playwright-report/results.json)");
                }
              ' 2>&1
              echo '```'
            else
              echo "(playwright-report/results.json not found — the json reporter in aftersign/playwright.config.ts should have written it; the run crashed BEFORE any spec ran, e.g. a webServer boot failure. Raw runner log tail below — #1065.)"
              if [ -f /tmp/aftersign-e2e-runner.log ]; then
                echo ""
                echo "### raw e2e runner log (last 80 lines)"
                echo '```'
                tail -n 80 /tmp/aftersign-e2e-runner.log
                echo '```'
              else
                echo "(runner log not captured — the e2e step may not have started)"
              fi
            fi
          } > "$summary_file"

          cat "$summary_file" | tee -a "$GITHUB_STEP_SUMMARY"

          # Export to $GITHUB_ENV using a random heredoc delimiter (the
          # summary contains fenced code blocks, so a plain EOF is unsafe).
          delim="EOF_AFTERSIGN_$(date +%s%N)_$$"
          {
            echo "AFTERSIGN_FIRST_CONTEXT<<${delim}"
            cat "$summary_file"
            echo "${delim}"
          } >> "$GITHUB_ENV"
      - name: Comment aftersign failure summary on PR
        if: failure() && steps.e2e.conclusion == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            // The comment body is built entirely from AFTERSIGN_FIRST_CONTEXT
            // exported by the "Print aftersign failure summary" step above.
            // This lane is self-sufficient: no dependency on any reporter
            // writing test-results/aftersign-failure-summary.md — the same
            // markdown that reaches $GITHUB_STEP_SUMMARY reaches the PR.
            let body = process.env.AFTERSIGN_FIRST_CONTEXT
              || '## aftersign WebGL e2e — failure summary\n\n(no failure context captured; see run logs)';

            if (body.length > 60000) {
              body = `${body.slice(0, 60000)}\n\n_(truncated for GitHub comment limit)_`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aftersign-playwright-trace
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  landing:
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:landing
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: landing-playwright-trace
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
