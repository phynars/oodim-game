# Generated by aidlc workflows-gen (schema 1) from the repo profile's ci.workflows. Re-render; a hand edit fails the workflows-drift job.
# sha256: 4cf70ef5187806823cbd09b1fb397e8b7e998cdc8333aef0df66f1b805dcf938
name: CI
on:
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * 1"
permissions:
  contents: read
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.event.schedule || github.event_name) }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pacman: "${{ steps.filter.outputs.pacman }}"
      galaga: "${{ steps.filter.outputs.galaga }}"
      doom: "${{ steps.filter.outputs.doom }}"
      agar: "${{ steps.filter.outputs.agar }}"
      aftersign: "${{ steps.filter.outputs.aftersign }}"
      landing: "${{ steps.filter.outputs.landing }}"
      harness: "${{ steps.filter.outputs.harness }}"
      shared: "${{ steps.filter.outputs.shared }}"
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            pacman:
              - 'pacman/**'
            galaga:
              - 'galaga/**'
            doom:
              - 'doom/**'
            agar:
              - 'agar/**'
            aftersign:
              - 'aftersign/**'
              - 'apps/web/src/aftersign/**'
              - 'e2e-shared/**'
              - 'scripts/rendered-text-recorder.js'
              - 'scripts/rendered-text-sink.mjs'
              - 'scripts/served-reach.mjs'
              - 'scripts/pr-ci-evidence*.mjs'
              - 'scripts/ci/**'
              - 'scripts/install-playwright-chromium.mjs'
              - 'packages/**'
              - 'src/server.ts'
              - 'wrangler.jsonc'
              - 'landing/**'
            landing:
              - 'landing/**'
            harness:
              - 'e2e-shared/multiplayer/**'
            shared:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
  workflows-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: "generated workflow files match their header hash"
        run: |-
          set -euo pipefail
          for f in .github/workflows/ci.yml .github/workflows/review-gate.yml .github/workflows/security-scan.yml .github/workflows/rebase-pr.yml .github/workflows/deploy.yml .github/workflows/deploy-staging.yml; do
            if [ ! -f "$f" ]; then echo "::error file=$f::generated workflow is missing (re-render from the repo profile)"; exit 1; fi
            want=$(sed -n '2s/^# sha256: //p' "$f")
            have=$(tail -n +3 "$f" | sha256sum | cut -c1-64)
            if [ "$want" != "$have" ]; then echo "::error file=$f::hand-edited generated workflow (re-render from the repo profile)"; exit 1; fi
          done
  wiring:
    if: "${{ (github.event_name == 'pull_request' || github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: "node scripts/check-product-wiring.mjs"
      - run: "node --test scripts/docs-index-check.test.mjs"
      - run: "node scripts/docs-index-check.mjs"
      - run: "node --test scripts/review-approval-gate.test.mjs"
      - run: "node --test scripts/pr-ci-evidence.test.mjs scripts/ci/aftersign-failure-summary.test.mjs scripts/ci/aftersign-e2e-select.test.mjs scripts/ci/aftersign-e2e-merge.test.mjs scripts/rendered-text-sink.test.mjs"
      - run: "node e2e-shared/no-wall-clock-waits/check.mjs"
  served-reach:
    if: "${{ (github.event_name == 'pull_request') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: "${{ steps.out.outputs.result }}"
      counts: "${{ steps.out.outputs.counts }}"
      exempt: "${{ steps.out.outputs.exempt }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - run: "node --test scripts/served-reach.test.mjs scripts/gate-exempt.test.mjs scripts/served-replay.test.mjs"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
      - id: out
        run: |-
          set +e
          set -o pipefail
          node scripts/served-reach.mjs 2>&1 | tee /tmp/served-reach.log
          status=${PIPESTATUS[0]}
          echo "result=$(sed -n 's/^SERVED_REACH_RESULT=//p' /tmp/served-reach.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "counts=$(sed -n 's/^- served source files changed: //p' /tmp/served-reach.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "exempt=$(sed -n 's/^GATE_EXEMPT=//p' /tmp/served-reach.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit "$status"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
  fail-to-pass:
    if: "${{ (github.event_name == 'pull_request') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: "node --test scripts/fail-to-pass.test.mjs"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
      - run: "GITHUB_OUTPUT=\"$RUNNER_TEMP/f2p-plan.out\" node scripts/fail-to-pass.mjs plan"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
      - run: |-
          set -euo pipefail
          plan="$RUNNER_TEMP/f2p-plan.out"
          if ! grep -qx 'result=run' "$plan"; then echo 'fail-to-pass: out of scope or exempt, nothing to run'; exit 0; fi
          npm install
          if grep -qx 'needs_browser=true' "$plan"; then node scripts/install-playwright-chromium.mjs; fi
          node scripts/fail-to-pass.mjs run
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
  served-worker:
    if: "${{ (github.event_name == 'pull_request') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: "bash scripts/ci/served-worker.sh"
      - if: "${{ always() }}"
        uses: actions/upload-artifact@v7
        with:
          name: served-worker
          path: |
            test-results/
            aftersign/test-results/
            aftersign/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  pacman:
    needs:
      - changes
    if: "${{ !cancelled() && needs.changes.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.outputs.pacman == 'true' || needs.changes.outputs.shared == 'true')) || github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - uses: actions/cache@v4
        with:
          path: "~/.cache/ms-playwright"
          key: "playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}"
      - run: "node scripts/install-playwright-chromium.mjs"
      - run: "npm run typecheck:pacman"
      - run: "npm run build:pacman"
      - run: "npm run test:e2e:pacman"
      - if: "${{ always() }}"
        uses: actions/upload-artifact@v7
        with:
          name: pacman
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  galaga:
    needs:
      - changes
    if: "${{ !cancelled() && needs.changes.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.outputs.galaga == 'true' || needs.changes.outputs.shared == 'true')) || github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - uses: actions/cache@v4
        with:
          path: "~/.cache/ms-playwright"
          key: "playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}"
      - run: "node scripts/install-playwright-chromium.mjs"
      - run: "npm run typecheck:galaga"
      - run: "npm run build:galaga"
      - run: "npm run test:e2e:galaga"
      - if: "${{ always() }}"
        uses: actions/upload-artifact@v7
        with:
          name: galaga
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  doom:
    needs:
      - changes
    if: "${{ !cancelled() && needs.changes.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.outputs.doom == 'true' || needs.changes.outputs.shared == 'true')) || github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - uses: actions/cache@v4
        with:
          path: "~/.cache/ms-playwright"
          key: "playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}"
      - run: "node scripts/install-playwright-chromium.mjs"
      - run: "npm run typecheck:doom"
      - run: "npm run build:doom"
      - run: "npm run test:e2e:doom"
      - if: "${{ always() }}"
        uses: actions/upload-artifact@v7
        with:
          name: doom
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  agar:
    needs:
      - changes
    if: "${{ !cancelled() && needs.changes.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.outputs.agar == 'true' || needs.changes.outputs.shared == 'true')) || github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - uses: actions/cache@v4
        with:
          path: "~/.cache/ms-playwright"
          key: "playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}"
      - run: "node scripts/install-playwright-chromium.mjs"
      - run: "npm run typecheck:agar"
      - run: "npm run build:agar"
      - run: "npm run test:e2e:agar"
      - run: "bash scripts/ci/redgreen.sh agar"
      - if: "${{ always() }}"
        uses: actions/upload-artifact@v7
        with:
          name: agar
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  aftersign-checks:
    needs:
      - changes
    if: "${{ !cancelled() && needs.changes.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.outputs.aftersign == 'true' || needs.changes.outputs.shared == 'true')) || github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - run: "bash scripts/ci/redgreen.sh markers"
      - run: "npm run typecheck:aftersign"
      - run: |-
          set -o pipefail
          npm run typecheck:aftersign:apps-web 2>&1 | sed 's/^/  [burn-down] /' || echo '::warning::burn-down typecheck still has errors (non-blocking)'
      - run: "npm run test:unit:aftersign"
      - run: "npm run build:aftersign"
      - run: "npm run test:aftersign:pure"
  aftersign:
    needs:
      - changes
      - served-reach
    if: "${{ !cancelled() && needs.changes.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.outputs.aftersign == 'true' || needs.changes.outputs.shared == 'true')) || github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: "npm install"
      - uses: actions/cache@v4
        with:
          path: "~/.cache/ms-playwright"
          key: "playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}"
      - run: "node scripts/install-playwright-chromium.mjs"
      - run: "bash scripts/ci/aftersign-e2e.sh run npm run test:e2e:aftersign"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GH_TOKEN: "${{ github.token }}"
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
          EVENT_NAME: "${{ github.event_name }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          SERVED_RESULT: "${{ needs.served-reach.outputs.result }}"
          SERVED_COUNTS: "${{ needs.served-reach.outputs.counts }}"
          SERVED_EXEMPT: "${{ needs.served-reach.outputs.exempt }}"
          SHARD_INDEX: "${{ matrix.shard }}"
          SHARD_TOTAL: "4"
      - run: "if [ \"$SHARD_INDEX\" = 1 ]; then bash scripts/ci/redgreen.sh aftersign; fi"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GH_TOKEN: "${{ github.token }}"
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
          EVENT_NAME: "${{ github.event_name }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          SERVED_RESULT: "${{ needs.served-reach.outputs.result }}"
          SERVED_COUNTS: "${{ needs.served-reach.outputs.counts }}"
          SERVED_EXEMPT: "${{ needs.served-reach.outputs.exempt }}"
          SHARD_INDEX: "${{ matrix.shard }}"
          SHARD_TOTAL: "4"
      - if: "${{ always() }}"
        uses: actions/upload-artifact@v7
        with:
          name: "aftersign-shard-${{ matrix.shard }}"
          path: |
            test-results/
            playwright-report/
            aftersign/playwright-report/
            ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
  aftersign-result:
    needs:
