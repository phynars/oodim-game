name: "Rebase PR onto main"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to rebase onto main"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: "rebase-pr-${{ inputs.pr }}"
  cancel-in-progress: false
jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Merge main into the PR branch (lock files auto-resolved)"
        env:
          GH_TOKEN: "${{ github.token }}"
          PR: "${{ inputs.pr }}"
        run: |-
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "::error::pr must be a number"; exit 1;; esac
          CROSS=$(gh pr view "$PR" --json isCrossRepository --jq .isCrossRepository)
          if [ "$CROSS" != false ]; then echo "::error::PR $PR is from a fork; not rebasing"; exit 1; fi
          BR=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          git config user.name "aidlc-rebase-bot"
          git config user.email "aidlc-rebase-bot@users.noreply.github.com"
          git fetch origin "$BR" main
          git checkout -B "$BR" "origin/$BR"
          if git merge origin/main --no-edit; then
            echo "clean merge"
          else
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in *package-lock.json|*pnpm-lock.yaml|*yarn.lock) git checkout --theirs "$f" && git add "$f";; esac
            done
            REMAIN=$(git diff --name-only --diff-filter=U || true)
            if [ -n "$REMAIN" ]; then
              git merge --abort
              gh pr comment "$PR" --body "🤖 auto-rebase: \`main\` conflicts in content files that need human/operator judgment (the bot auto-resolves lock files only): $REMAIN — labeled \`agent-needs-human\`."
              gh pr edit "$PR" --add-label agent-needs-human || true
              exit 0
            fi
            git commit --no-edit
          fi
          git push origin "$BR"
          gh pr comment "$PR" --body "🤖 auto-rebase: merged \`main\` into this PR (lock conflicts auto-resolved) and pushed." || true
