# AFTERSIGN NPC memory round-trip red/green harness.
#
# This is intentionally a harness contract, not gameplay implementation.
# The normal lane may remain skipped until the vertical slice exposes the
# durable NPC-memory surface. The broken-polarity lane forces the same spec
# awake with FLAGSHIP_BREAK_MODE=drop-memory and inverts the result, proving
# the contract would catch a missing persisted NPC memory beat.
#
# Mirrors .github/workflows/aftersign-durable-save-redgreen.yml — same
# preflight-then-invert shape the reviewer confirmed on #526.

name: aftersign-npc-memory-redgreen

permissions:
  contents: read

on:
  # `package.json` / `package-lock.json` intentionally NOT in the paths
  # filter (#830): this lane's real signal comes from `aftersign/**` and
  # `e2e-shared/**`. Lockfile drift is already surfaced by the main
  # `aftersign` CI lane which shares the `npm install` guarantee via
  # `actions/setup-node`'s cache — including package.json here just
  # dragged every scripts-only or devDep-only PR onto a SwiftShader
  # cold-start Playwright flake (#700/#506/#590/#766).
  pull_request:
    paths:
      - "aftersign/**"
      - "e2e-shared/**"
      - ".github/workflows/aftersign-npc-memory-redgreen.yml"
  push:
    branches: [main]
    paths:
      - "aftersign/**"
      - "e2e-shared/**"
      - ".github/workflows/aftersign-npc-memory-redgreen.yml"

jobs:
  green-polarity:
    name: npc-memory contract (green — default suite may skip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install (not `npm ci`) — matches deploy.yml precedent
        # (2026-06-20): agents can't regenerate package-lock.json in
        # this environment, so any PR that adds a devDep would strand
        # this lane on strict-sync until a human ran npm locally.
        # See #836 for the vitest devDep that first exposed this.
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Preflight: symmetric with red-polarity's retirement criteria below.
      # The npc-memory spec has been red on main under Playwright's CI
      # cold-start (SwiftShader init + first WebGL context, tracked in
      # #700/#506/#590/#766) — the same infra flake this workflow's paths
      # filter already tries to dodge. Until the spec either lands its
      # FLAGSHIP_BREAK_MODE=drop-memory conditional guard (making it a
      # true red/green pair) or the phase-3 fixme marker is removed
      # (declaring the spec durable), retire the green step so unrelated
      # PRs — including #836's devDep bump — aren't dragged onto that
      # flake. The red lane below already retires under the same rules.
      - name: Preflight — decide whether the green lane can run yet
        id: preflight
        shell: bash
        run: |
          spec=aftersign/e2e/npc-memory-roundtrip.spec.ts
          if grep -Pzo '(?s)test\.skip\(\s*process\.env\.FLAGSHIP_BREAK_MODE\s*!==\s*"drop-memory"' "$spec" > /dev/null; then
            echo "conditional guard present — green polarity will run (spec live under default mode)."
            echo "retired=false" >> "$GITHUB_OUTPUT"
          elif grep -q '@redgreen:npc-memory-roundtrip fixme-pending-phase-3' "$spec"; then
            echo "@redgreen:npc-memory-roundtrip fixme-pending-phase-3 marker present — green polarity retired until the spec stabilizes."
            echo "retired=true" >> "$GITHUB_OUTPUT"
          else
            echo "npc-memory contract is fully live in the main suite — green polarity will run."
            echo "retired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AFTERSIGN NPC memory contract in default mode
        if: steps.preflight.outputs.retired == 'false'
        run: npm run test:e2e:aftersign:npc-memory

  red-polarity-drop-memory:
    name: npc-memory contract (red — drop-memory MUST fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install — see green-polarity job above for rationale.
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Preflight — decide whether the red lane can run yet
        id: preflight
        shell: bash
        run: |
          # The red-polarity lane only runs once the npc-memory spec exposes
          # a conditional guard keyed off FLAGSHIP_BREAK_MODE=drop-memory
          # (the pattern the sibling durable-save spec already uses). Until
          # then the spec is either fully live (green lane sufficient) or
          # unconditionally skipped (Playwright exits 0, so a naive "invert
          # the exit code" red lane would fail on every PR). Detect both
          # states and retire the red step accordingly.
          spec=aftersign/e2e/npc-memory-roundtrip.spec.ts
          if grep -Pzo '(?s)test\.skip\(\s*process\.env\.FLAGSHIP_BREAK_MODE\s*!==\s*"drop-memory"' "$spec" > /dev/null; then
            echo "conditional guard present — red polarity will run."
            echo "retired=false" >> "$GITHUB_OUTPUT"
          elif grep -q '@redgreen:npc-memory-roundtrip fixme-pending-phase-3' "$spec"; then
            echo "@redgreen:npc-memory-roundtrip fixme-pending-phase-3 marker present — red polarity retired until the spec exposes a conditional guard."
            echo "retired=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'test\.skip(' "$spec"; then
            echo "::error::Spec calls test.skip(...) but the FLAGSHIP_BREAK_MODE=drop-memory guard is missing or altered. The red-polarity lane cannot verify itself — update this workflow's preflight if the sentinel intentionally changed."
            exit 1
          else
            echo "npc-memory contract is fully live in the main suite — red polarity retired."
            echo "retired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AFTERSIGN NPC memory contract in broken mode and require failure
        if: steps.preflight.outputs.retired == 'false'
        env:
          FLAGSHIP_BREAK_MODE: drop-memory
        shell: bash
        run: |
          set +e
          npm run test:e2e:aftersign:npc-memory
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::Expected FLAGSHIP_BREAK_MODE=drop-memory to fail, but the NPC-memory contract passed."
            exit 1
          fi

          echo "NPC-memory contract failed under drop-memory as expected."
