name: review-approval
on:
  pull_request_review:
    types:
      - submitted
      - dismissed
permissions:
  contents: read
concurrency:
  group: "review-approval-${{ github.event.pull_request.number }}"
  cancel-in-progress: false
jobs:
  review-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ github.event.repository.default_branch }}"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: "node scripts/review-approval-gate.mjs"
        env:
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
          GH_TOKEN: "${{ github.token }}"
          GITHUB_TOKEN: "${{ github.token }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          REVIEW_GATE_MODE: review
  rerun:
    if: "${{ github.event.review.state == 'approved' && github.event.pull_request.base.ref == github.event.repository.default_branch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ github.event.repository.default_branch }}"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: "node --test scripts/gate-exempt.test.mjs"
        env:
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
          GH_TOKEN: "${{ github.token }}"
          GITHUB_TOKEN: "${{ github.token }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          REVIEW_GATE_MODE: review
      - run: "node scripts/gate-exempt.mjs rerun"
        env:
          GATE_EXEMPT_APPROVERS: "${{ vars.GATE_EXEMPT_APPROVERS }}"
          GH_TOKEN: "${{ github.token }}"
          GITHUB_TOKEN: "${{ github.token }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          REVIEW_GATE_MODE: review
