# Red/green polarity gates — ALL products, ONE workflow (issue #615).
#
# Consolidates the four former per-proof workflow files:
#   aftersign-durable-save-redgreen.yml   (mirror of #526's shape)
#   aftersign-npc-memory-redgreen.yml     (#526)
#   agar-multiplayer-redgreen.yml         (#276)
#   agar-persistence-redgreen.yml         (#323)
# Step logic is preserved verbatim from those files (same proofs, same
# preflights, same polarity inversions); only the triggering changed — a
# single dorny/paths-filter `changes` job gates per-product JOB groups, so
# one workflow run replaces up to four.
#
# STANDING RULE (#615 rule 2): a new red-green proof = a NEW JOB in this
# file behind the right `changes` output — never a new workflow FILE.
# Workflow files are TD/operator territory.
#
# Red/green polarity in one line: the green job runs the spec normally and
# must pass; the red job runs the same spec under a break-mode and INVERTS
# the exit code — a passing broken build means the guard proves nothing.
#
# Lockfile/package.json deliberately NOT in any paths filter (the #830
# lesson): these lanes' signal comes from product trees; deps-only PRs are
# covered by the main ci.yml lanes. agar is FROZEN — its proofs only matter
# when agar/ itself changes (dependabot #965).
#
# npm install (not `npm ci`) everywhere — deploy.yml precedent (2026-06-20):
# agents can't regenerate package-lock.json in this environment; strict-sync
# would strand these lanes on any agent-authored devDep bump (#836).
#
# KNOWN DEBT (absorbed #727): the aftersign preflights key on grep-able
# marker strings in spec files (@redgreen:* fixme-pending-phase-3) rather
# than config. Kept as-is in this consolidation — the markers now carry
# enforced expiry metadata (#1012) — but new proofs should prefer
# config/env keyed retirement over spec-text markers.

name: redgreen

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "aftersign/**"
      - "agar/**"
      - "e2e-shared/**"
      - ".github/workflows/redgreen.yml"
  push:
    branches: [main]
    paths:
      - "aftersign/**"
      - "agar/**"
      - "e2e-shared/**"
      - ".github/workflows/redgreen.yml"
  workflow_dispatch:
    inputs:
      run_agar_archival:
        description: "Run frozen agar red/green archival lanes"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "15 6 * * 1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      aftersign: ${{ steps.filter.outputs.aftersign }}
      agar: ${{ steps.filter.outputs.agar }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            aftersign:
              - "aftersign/**"
              - "e2e-shared/**"
              - ".github/workflows/redgreen.yml"
            agar:
              - "agar/**"
              - "e2e-shared/**"
              - ".github/workflows/redgreen.yml"

  # ---------------------------------------------------------------- shared
  # fixme-pending-phase-3 marker hygiene (was duplicated in both aftersign
  # green jobs; #1012 added the expiry metadata contract this enforces).
  marker-expiry:
    needs: changes
    if: ${{ needs.changes.outputs.aftersign == 'true' }}
    name: aftersign @redgreen markers carry unexpired expiry metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard — fixme-pending-phase-3 markers must carry unexpired expiry metadata
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          fail=0
          while IFS= read -r hit; do
            file=${hit%%:*}
            rest=${hit#*:}
            line=${rest%%:*}
            text=${rest#*:}
            if ! grep -qE 'expires=[0-9]{4}-[0-9]{2}-[0-9]{2} owner=[A-Za-z0-9._-]+' <<<"$text"; then
              echo "::error file=$file,line=$line::fixme-pending-phase-3 marker is missing 'expires=YYYY-MM-DD owner=<name>' metadata"
              fail=1
              continue
            fi
            expiry=$(sed -nE 's/.*expires=([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p' <<<"$text")
            if [[ "$expiry" < "$today" ]]; then
              echo "::error file=$file,line=$line::fixme-pending-phase-3 marker expired on $expiry (today is $today) — remove the marker or renew the expiry"
              fail=1
            fi
          done < <(grep -rnE '^[[:space:]]*// @redgreen:[a-z-]+ fixme-pending-phase-3' aftersign/ || true)
          exit "$fail"

  # ------------------------------------------------- aftersign durable-save
  aftersign-durable-green:
    needs: changes
    if: ${{ needs.changes.outputs.aftersign == 'true' }}
    name: durable-save contract (green — default suite remains skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      # Preflight (#1071): lane retirement is keyed on the checked-in config
      # (aftersign/redgreen.config.json), NOT on grep-able spec markers.
      - name: Preflight — read lane state from redgreen.config.json
        id: preflight
        shell: bash
        run: |
          state=$(node -p 'JSON.parse(require("fs").readFileSync("aftersign/redgreen.config.json","utf8"))["durable-save"].green')
          echo "durable-save green lane: $state (aftersign/redgreen.config.json)"
          if [ "$state" = "live" ]; then echo "retired=false" >> "$GITHUB_OUTPUT"; else echo "retired=true" >> "$GITHUB_OUTPUT"; fi
      - name: Run AFTERSIGN durable save/load spec in default mode
        if: steps.preflight.outputs.retired == 'false'
        run: npm run test:e2e:aftersign:durable-save

  aftersign-durable-red:
    needs: changes
    if: ${{ needs.changes.outputs.aftersign == 'true' }}
    name: durable-save contract (red — local-only-save MUST fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      - name: Preflight — config state + guard-string sanity
        id: preflight
        shell: bash
        run: |
          # #1071: the config decides live/retired. The guard-string check
          # stays as a SAFETY: a lane marked live whose spec lost its
          # FLAGSHIP_BREAK_MODE guard cannot verify itself — fail loud.
          state=$(node -p 'JSON.parse(require("fs").readFileSync("aftersign/redgreen.config.json","utf8"))["durable-save"].red')
          echo "durable-save red lane: $state (aftersign/redgreen.config.json)"
          if [ "$state" != "live" ]; then
            echo "retired=true" >> "$GITHUB_OUTPUT"
          else
            spec=aftersign/e2e/save-load-durable-contract.spec.ts
            if grep -Pzo '(?s)process\.env\.FLAGSHIP_BREAK_MODE\s*!==\s*"local-only-save"' "$spec" > /dev/null; then
              echo "retired=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::redgreen.config.json marks durable-save.red LIVE but the FLAGSHIP_BREAK_MODE=local-only-save guard is missing from $spec — the lane cannot verify itself. Fix the spec or flip the config in the same PR."
              exit 1
            fi
          fi
      - name: Run AFTERSIGN durable save/load contract (red polarity — MUST fail)
        if: steps.preflight.outputs.retired == 'false'
        shell: bash
        run: |
          set +e
          npm run test:e2e:aftersign:durable-save:broken-local-only
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Broken-polarity spec passed (exit 0) — durable save/load did NOT catch the local-only-save break mode."
            exit 1
          else
            echo "Broken-polarity spec failed as expected (exit $rc) — durable save/load guard is honest."
            exit 0
          fi

  # --------------------------------------------------- aftersign npc-memory
  aftersign-npc-memory-green:
    needs: changes
    if: ${{ needs.changes.outputs.aftersign == 'true' }}
    name: npc-memory contract (green — default suite may skip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      - name: Preflight — read lane state from redgreen.config.json
        id: preflight
        shell: bash
        run: |
          state=$(node -p 'JSON.parse(require("fs").readFileSync("aftersign/redgreen.config.json","utf8"))["npc-memory"].green')
          echo "npc-memory green lane: $state (aftersign/redgreen.config.json)"
          if [ "$state" = "live" ]; then echo "retired=false" >> "$GITHUB_OUTPUT"; else echo "retired=true" >> "$GITHUB_OUTPUT"; fi
      - name: Run AFTERSIGN NPC memory contract in default mode
        if: steps.preflight.outputs.retired == 'false'
        run: npm run test:e2e:aftersign:npc-memory

  aftersign-npc-memory-red:
    needs: changes
    if: ${{ needs.changes.outputs.aftersign == 'true' }}
    name: npc-memory contract (red — drop-memory MUST fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      - name: Preflight — config state + guard-string sanity
        id: preflight
        shell: bash
        run: |
          # #1071: config decides; guard check is the fail-loud safety.
          state=$(node -p 'JSON.parse(require("fs").readFileSync("aftersign/redgreen.config.json","utf8"))["npc-memory"].red')
          echo "npc-memory red lane: $state (aftersign/redgreen.config.json)"
          if [ "$state" != "live" ]; then
            echo "retired=true" >> "$GITHUB_OUTPUT"
          else
            spec=aftersign/e2e/npc-memory-roundtrip.spec.ts
            if grep -Pzo '(?s)test\.skip\(\s*process\.env\.FLAGSHIP_BREAK_MODE\s*!==\s*"drop-memory"' "$spec" > /dev/null; then
              echo "retired=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::redgreen.config.json marks npc-memory.red LIVE but the FLAGSHIP_BREAK_MODE=drop-memory guard is missing from $spec — the lane cannot verify itself. Fix the spec or flip the config in the same PR."
              exit 1
            fi
          fi
      - name: Run AFTERSIGN NPC memory contract in broken mode and require failure
        if: steps.preflight.outputs.retired == 'false'
        env:
          FLAGSHIP_BREAK_MODE: drop-memory
        shell: bash
        run: |
          set +e
          npm run test:e2e:aftersign:npc-memory
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Expected FLAGSHIP_BREAK_MODE=drop-memory to fail, but the NPC-memory contract passed."
            exit 1
          fi
          echo "NPC-memory contract failed under drop-memory as expected."

  # ----------------------------------------------------- agar multiplayer
  # (#276) green runs the existing build; red runs the AC3 desync-broken
  # build (AGAR_DO_BREAK_MODE=drop-every-7th via playwright.broken.config.ts
  # → `dev:agar-server:broken`). Spec file is byte-identical across both —
  # that invariance IS the proof (agar/docs/desync-broken-fixture-plan.md).
  agar-multiplayer-green:
    needs: changes
    if: ${{ needs.changes.outputs.agar == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_agar_archival == 'true') }}
    name: agar multiplayer (green — main DO, spec must pass)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      - name: Run agar multiplayer-convergence spec (green polarity)
        run: npm run test:e2e:agar

  agar-multiplayer-red:
    needs: changes
    if: ${{ needs.changes.outputs.agar == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_agar_archival == 'true') }}
    name: agar multiplayer (red — drop-every-7th DO, spec must fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      - name: Run agar multiplayer-convergence spec (red polarity — MUST fail)
        shell: bash
        run: |
          set +e
          npm run test:e2e:agar:broken
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Broken-polarity spec passed (exit 0) — the AC3 drop logic is not exercising the convergence guard. Did the drop point regress?"
            exit 1
          fi
          echo "Broken-polarity spec failed as expected (exit $rc) — AC3 guard is honest."

  # ----------------------------------------------------- agar persistence
  # (#323) WIRING: break-mode env must reach the WORKER via the per-mode
  # npm scripts (`wrangler dev --var AGAR_DO_BREAK_MODE:...`) — a step-level
  # `env:` lands on the runner shell, not the wrangler subprocess (the
  # round-1 wiring bug; do not regress).
  agar-persistence-green:
    needs: changes
    if: ${{ needs.changes.outputs.agar == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_agar_archival == 'true') }}
    name: agar persistence-harness (green — default mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      - name: Run agar persistence-harness spec (green polarity)
        run: npm run test:e2e:agar:persistence

  agar-persistence-red-monotonic:
    needs: changes
    if: ${{ needs.changes.outputs.agar == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_agar_archival == 'true') }}
    name: agar persistence (red — non-monotone-persist MUST fail monotonic-persist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      # AC3 skip-when-skipped guard: anchored on the test title, `-A 3`
      # window; matches bare `test.skip(` because the spec splits the call
      # across lines (round-1 Mara catch).
      - name: Skip-when-skipped preflight (monotonic-persist)
        id: preflight
        shell: bash
        run: |
          if grep -A 3 'test(\s*"monotonic-persist' agar/e2e/persistence-harness.spec.ts | grep -q 'test\.skip('; then
            echo "monotonic-persist is still skipped — red polarity not enforced this run."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "monotonic-persist is live — enforcing red polarity under AGAR_DO_BREAK_MODE=non-monotone-persist."
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run agar persistence-harness monotonic-persist (red polarity — MUST fail)
        if: steps.preflight.outputs.skipped == 'false'
        shell: bash
        run: |
          set +e
          npm run test:e2e:agar:persistence:broken-non-monotone
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Broken-polarity spec passed (exit 0) — monotonic-persist did NOT catch the non-monotone-persist break mode. Did slice 1's break-mode wiring regress, or is the test asserting a weaker property than the harness contract?"
            exit 1
          else
            echo "Broken-polarity spec failed as expected (exit $rc) — monotonic-persist guard is honest."
            exit 0
          fi

  agar-persistence-red-eviction:
    needs: changes
    if: ${{ needs.changes.outputs.agar == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_agar_archival == 'true') }}
    name: agar persistence (red — lossy-persist MUST fail eviction-roundtrip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: node scripts/install-playwright-chromium.mjs
      # eviction-roundtrip is live (slice 3); keep the preflight so an
      # accidental re-skip logs explicitly instead of pretending the
      # lossy-persist polarity was exercised.
      - name: Skip-when-skipped preflight (eviction-roundtrip)
        id: preflight
        shell: bash
        run: |
          if grep -A 3 'test(\s*"eviction-roundtrip' agar/e2e/persistence-harness.spec.ts | grep -q 'test\.skip('; then
            echo "eviction-roundtrip is skipped — red polarity not enforced this run."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "eviction-roundtrip is live — enforcing red polarity under AGAR_DO_BREAK_MODE=lossy-persist."
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run agar persistence-harness eviction-roundtrip (red polarity — MUST fail)
        if: steps.preflight.outputs.skipped == 'false'
        shell: bash
        run: |
          set +e
          npm run test:e2e:agar:persistence:broken-lossy
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Broken-polarity spec passed (exit 0) — eviction-roundtrip did NOT catch the lossy-persist break mode."
            exit 1
          else
            echo "Broken-polarity spec failed as expected (exit $rc) — eviction-roundtrip guard is honest."
            exit 0
          fi
