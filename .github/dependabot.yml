# Automated dependency-update PRs for the public oodim-game repo (added
# 2026-07-09 hardening). Security updates + grouped weekly version bumps so
# vulnerable deps surface as PRs instead of going stale. Grouped to avoid the
# per-dep PR spam that hit the sibling repos (2026-07-04).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # (#959 resolved 2026-08-08: wrangler unpinned at 4.120.0.)
    # MAJOR version bumps are DELIBERATE human decisions, not weekly churn
    # (2026-08-09, Kyoung: AIDLC cycles go to the game, not toolchain
    # migrations). The dev-deps group PR #1080 bundled TypeScript 5->7,
    # vitest 3->4, jsdom 26->30 and deterministically broke the reload-beat
    # e2e. Minors/patches keep flowing weekly; security fixes surface via
    # Dependabot ALERTS regardless (the alert->fix flow is proven, #1024).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @playwright/test stays at the locked 1.61.1 (Kyoung, 2026-11-11).
      # From 1.62 on, page timers fire seconds late and requestAnimationFrame
      # starves in headless runs, which fails the timing specs: the aftersign
      # beat-duration contract (6,847 ms against a 1,350 ms limit) and doom's
      # mouselook frame-time (PR 1137 on 1.62.1 in August, PR 2719 on 1.65.0).
      # A comment-based ignore did not hold. Remove this entry once those
      # specs no longer depend on the browser's timer fidelity.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # Every workflow here is rendered from the oodim repo profile (11-09),
    # which owns these pins: a bump in a generated file fails the
    # workflows-drift job.
    ignore:
      - dependency-name: "cloudflare/wrangler-action"
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/setup-node"
      - dependency-name: "actions/cache"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
      - dependency-name: "dorny/paths-filter"
