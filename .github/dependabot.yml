# Automated dependency-update PRs for the public oodim-game repo (added
# 2026-07-09 hardening). Security updates + grouped weekly version bumps so
# vulnerable deps surface as PRs instead of going stale. Grouped to avoid the
# per-dep PR spam that hit the sibling repos (2026-07-04).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # (#959 resolved 2026-08-08: wrangler unpinned at 4.120.0.)
    # MAJOR version bumps are DELIBERATE human decisions, not weekly churn
    # (2026-08-09, Kyoung: AIDLC cycles go to the game, not toolchain
    # migrations). The dev-deps group PR #1080 bundled TypeScript 5->7,
    # vitest 3->4, jsdom 26->30 and deterministically broke the reload-beat
    # e2e. Minors/patches keep flowing weekly; security fixes surface via
    # Dependabot ALERTS regardless (the alert->fix flow is proven, #1024).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
